<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서고 책 카드</title>
<meta name="description" content="친구가 서고에서 보낸 책 카드예요.">
<meta property="og:title" content="친구가 책 한 권을 보냈어요">
<meta property="og:description" content="서고에서 보낸 책 카드예요. 눌러서 열어 보세요.">
<meta property="og:image" content="https://booktrack.pages.dev/icon-512.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 공유받은 사람이 보는 책 카드 (앱이 없어도 열림). 앱과 같은 흰 바탕 + 코랄 */
:root{
  --bg:#ffffff; --soft:#f6f7f9; --line:#eef0f3; --text:#191f28; --text-2:#4e5968; --text-3:#8b95a1;
  --coral:#f76e5a; --coral-soft:#fff0ec; --coral-ink:#c2412d;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#16161b; --soft:#202027; --line:#2c2c35; --text:#f2f4f6; --text-2:#b0b8c1; --text-3:#7d8590;
  --coral:#ff7b67; --coral-soft:#3a2622; --coral-ink:#ffa594; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-0.01em;word-break:keep-all;
  padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}
.wrap{max-width:440px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.mark{width:46px;height:46px;border-radius:13px;background:var(--coral);color:var(--coral);display:flex;align-items:center;justify-content:center}
.lockup{display:inline-flex;flex-direction:column;font-family:Jua,var(--font);line-height:1}.lockup .tg{color:var(--coral);margin-top:4px}
h1{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin:0}
.card{background:var(--soft);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px}
.rec{font-size:13px;color:var(--coral-ink);font-weight:700}
.top{display:flex;gap:16px;align-items:flex-start}
.top .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.kind{font-size:12.5px;color:var(--text-3)}
h2{font-size:20px;font-weight:800;line-height:1.35;margin:0;overflow-wrap:anywhere;letter-spacing:-0.02em}
.by{font-size:13.5px;color:var(--text-2);overflow-wrap:anywhere}
.cover{position:relative;flex:none;width:92px;aspect-ratio:2/3;background:var(--c);color:#fff;border-radius:6px;overflow:hidden;
  padding:12px 9px 9px 12px;font-size:13px;font-weight:700;line-height:1.3;box-shadow:0 6px 16px -6px rgba(25,31,40,.4)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.label{font-size:12.5px;font-weight:600;color:var(--text-3);margin-bottom:-8px}
.feel{font-size:15px;line-height:1.75;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.quote{background:var(--bg);border-radius:16px;padding:16px}
.quote p{margin:0;font-size:16.5px;line-height:1.75;font-weight:500;overflow-wrap:anywhere}
.ul{background-image:linear-gradient(transparent 62%,color-mix(in srgb,var(--coral) 28%,transparent) 62% 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.page{font-size:12px;color:var(--text-3);text-align:right;margin-top:6px}
.cta{display:block;text-align:center;background:var(--coral);color:#fff;text-decoration:none;font-weight:700;border-radius:14px;padding:14px 18px}
.small{font-size:12.5px;color:var(--text-3);text-align:center;margin:0}
.oops{text-align:center;color:var(--text-2);padding:60px 10px;font-size:16px;line-height:1.8}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const COVER_COLORS = ["#f76e5a", "#3f9d74", "#3b7be8", "#8a6ae6", "#e8963a", "#2aa5a0", "#df5f8a", "#55657d", "#b5793f", "#6a8f3a"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = t => { let h = 0; for(const c of String(t)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
// ───────────────────────── 로고 글자 (주아체) ─────────────────────────
// 큰 곳(첫 화면·공유 화면)은 "서고" + 아래 "다시, 일어서고". '서'의 왼쪽 획은 '다'의 왼쪽 획에,
// '고'의 오른쪽 획은 마지막 '고'의 오른쪽 획에 맞춘다. 글자 상자에는 숨은 여백이 있어서 실제 획 경계(잉크)를 재서 놓는다.
// 앱 맨 위 작은 로고는 "서고"만(형 결정 A, 2026-10-09).
const TAGLINE = "다시, 일어서고";
const juaReady = document.fonts ? document.fonts.load("40px Jua", "서고다시일어").catch(() => {}) : Promise.resolve();
function lockup(s1, s2, gap){
  return `<span class="lockup" data-s1="${s1}" data-s2="${s2}" data-gap="${gap}" aria-label="서고, ${TAGLINE}">
    <span class="wm" style="font-size:${s1}px">서고</span><span class="tg" style="font-size:${s2}px">${TAGLINE}</span></span>`;
}
function fitLockups(root = document){
  const els = root.querySelectorAll(".lockup:not([data-done])");
  if(!els.length) return;
  juaReady.then(() => {
    const ctx = document.createElement("canvas").getContext("2d");
    const m = (t, s) => { ctx.font = `${s}px Jua`; const r = ctx.measureText(t); return {l: r.actualBoundingBoxLeft, r: r.actualBoundingBoxRight, a: r.actualBoundingBoxAscent, d: r.actualBoundingBoxDescent}; };
    els.forEach(el => {
      const s1 = +el.dataset.s1, s2 = +el.dataset.s2, gap = +el.dataset.gap;
      const a = m("서", s1), b = m("고", s1), t = m(TAGLINE, s2);
      const L = -t.l, R = t.r, x1 = L + a.l, x2 = R - b.r;
      const base1 = Math.max(a.a, b.a), base2 = base1 + Math.max(a.d, b.d) + gap + t.a;
      const W = R - L, H = base2 + t.d, ox = -L;
      el.innerHTML = `<svg width="${W.toFixed(1)}" height="${H.toFixed(1)}" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible" aria-hidden="true">
        <text x="${ox + x1}" y="${base1}" font-family="Jua" font-size="${s1}" style="fill:var(--text)">서</text>
        <text x="${ox + x2}" y="${base1}" font-family="Jua" font-size="${s1}" style="fill:var(--text)">고</text>
        <text x="${ox}" y="${base2}" font-family="Jua" font-size="${s2}" style="fill:var(--coral)">${TAGLINE}</text></svg>`;
      el.dataset.done = "1";
    });
  });
}

const BRAND = `<a class="brand" href="/"><span class="mark"><svg width="38" height="38" viewBox="12 14 88 84" aria-hidden="true"><g transform="rotate(-18 40 88)"><rect x="24" y="34" width="20" height="54" rx="4" fill="#fff" opacity=".55"/></g><rect x="78" y="40" width="14" height="48" rx="3" fill="#fff" opacity=".8"/><rect x="50" y="20" width="24" height="68" rx="4" fill="#fff"/><path d="M60 20h7v17l-3.5-3-3.5 3z" fill="currentColor"/><rect x="18" y="88" width="78" height="5" rx="2.5" fill="#fff" opacity=".85"/></svg></span>${lockup(30, 9.5, 5)}</a>`;


// 주소 '#' 뒤에 담긴 책 카드 읽기
function read(){
  try {
    const b64 = location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    return d && typeof d.t === "string" && d.t ? d : null;
  } catch { return null; }
}

const d = read();
const app = document.getElementById("app");
if(!d){
  app.innerHTML = `${BRAND}<p class="oops">책 카드를 열 수 없어요.<br>받은 링크가 잘리지 않았는지 확인해 주세요.</p>
    <a class="cta" href="/">서고 둘러보기</a>`;
} else {
  document.title = `『${d.t}』 — 서고 책 카드`;
  // 표지 사진은 책 정보 서비스(카카오, 국립중앙도서관, 알라딘 이미지) 주소일 때만 보여 준다
  const okCover = /^https:\/\/([a-z0-9-]+\.)*(kakaocdn\.net|nl\.go\.kr)\//.test(d.c || "") || /^https:\/\/image\.aladin\.co\.kr\//.test(d.c || "");
  const state = ["지금 읽고 있어요", "다 읽었어요", "읽고 싶은 책이에요"][d.s] || "지금 읽고 있어요";
  app.innerHTML = `${BRAND}
    <h1>${d.r ? "이 책을 추천해요" : ["이 책을 읽고 있어요", "이 책을 다 읽었어요", "이 책이 읽고 싶어요"][d.s] || "이 책을 읽고 있어요"}</h1>
    <article class="card">
      ${d.r ? `<span class="rec">추천하고 싶은 책</span>` : ""}
      <div class="top">
        <div class="cover" style="--c:${COVER_COLORS[hash(d.t) % COVER_COLORS.length]}">${okCover ? `<img src="${esc(d.c)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}${esc(d.t)}</div>
        <div class="t">${d.g ? `<span class="kind">${esc(d.g)}</span>` : ""}<h2>${esc(d.t)}</h2>
          <span class="by">${esc([d.a, d.p].filter(Boolean).join(" · "))}</span>
          <span class="by">${state}</span></div>
      </div>
      ${d.f ? `<span class="label">보낸 사람의 느낌</span><p class="feel">${esc(d.f)}</p>` : ""}
      ${d.q ? `<span class="label">밑줄 친 문장</span><div class="quote"><p><span class="ul">${esc(d.q)}</span></p>${d.qp ? `<div class="page">p.${esc(d.qp)}</div>` : ""}</div>` : ""}
    </article>
    <a class="cta" href="/">나도 서고에 독서 기록 남기기</a>
    <p class="small">서고는 읽은 책과 밑줄 친 문장을 모아 두는 독서 기록장이에요. 책에서 힘을 얻어 다시 일어서고.</p>`;
}
fitLockups(app);
</script>
</body>
</html>
