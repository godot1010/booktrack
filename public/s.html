<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Book612 책 카드</title>
<meta name="description" content="친구가 Book612에서 보낸 책 카드예요.">
<meta property="og:title" content="친구가 책 한 권을 보냈어요">
<meta property="og:description" content="Book612에서 보낸 책 카드예요. 눌러서 열어 보세요.">
<meta property="og:image" content="https://booktrack.pages.dev/icon-512.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f5eedc">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 공유받은 사람이 보는 책 카드 (앱이 없어도 열림). 앱과 같은 어린왕자 색: 모래색 바탕 + 밤하늘 남색 + 별 금색 */
:root{
  --bg:#f5eedc; --soft:#fffaf0; --line:#e7dbc0; --text:#1f2a55; --text-2:#4f5677; --text-3:#8a8597;
  --accent:#2b3a72; --on-accent:#fdf3dc; --gold:#e0a823; --star:#f6c453; --rose:#e4574f;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141a33; --soft:#1d2547; --line:#2a345e; --text:#f5eedc; --text-2:#cfc8b4; --text-3:#8f8aa3;
  --accent:#f6c453; --on-accent:#1f2a55; --gold:#f6c453; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-0.01em;word-break:keep-all;
  padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}
.wrap{max-width:440px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.brand .word{font-family:Jua,var(--font);font-size:26px;line-height:1;padding-top:2px}
.brand .word b{font-weight:400;color:var(--gold)}.brand .word i{font-style:normal;font-size:.56em}
h1{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin:0}
.card{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px}
.rec{font-size:13px;color:var(--rose);font-weight:700}
.top{display:flex;gap:16px;align-items:flex-start}
.top .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.kind{font-size:12.5px;color:var(--text-3)}
h2{font-size:20px;font-weight:800;line-height:1.35;margin:0;overflow-wrap:anywhere;letter-spacing:-0.02em}
.by{font-size:13.5px;color:var(--text-2);overflow-wrap:anywhere}
.cover{position:relative;flex:none;width:92px;aspect-ratio:2/3;background:var(--c);color:#fff;border-radius:6px;overflow:hidden;
  padding:12px 9px 9px 12px;font-size:13px;font-weight:700;line-height:1.3;box-shadow:0 6px 16px -6px rgba(25,31,40,.4)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.label{font-size:12.5px;font-weight:600;color:var(--text-3);margin-bottom:-8px}
.feel{font-size:15px;line-height:1.75;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.quote{background:#1f2a55;color:#fdf3dc;border-radius:16px;padding:16px}
.quote p{margin:0;font-size:16.5px;line-height:1.75;font-weight:500;overflow-wrap:anywhere}
.ul{background-image:linear-gradient(transparent 62%,rgba(246,196,83,.35) 62% 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.page{font-size:12px;color:rgba(253,243,220,.7);text-align:right;margin-top:6px}
.cta{display:block;text-align:center;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:700;border-radius:14px;padding:14px 18px}
.small{font-size:12.5px;color:var(--text-3);text-align:center;margin:0}
.oops{text-align:center;color:var(--text-2);padding:60px 10px;font-size:16px;line-height:1.8}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
// 앱(index.html)과 같은 표지 색
const COVER_COLORS = ["#2b3a72", "#c8504a", "#4f8a63", "#c9932e", "#de7a52", "#6b5b95", "#2f7f78", "#8a6a3b", "#4a6fa5", "#a0556f"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = t => { let h = 0; for(const c of String(t)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
// 로고: 소행성 B612 위의 장미 (앱과 같은 그림, 여기서는 움직이지 않는 활짝 핀 모습) + "Book612"
const ICON = `<svg width="40" height="40" viewBox="0 0 104 104" aria-hidden="true"><rect width="104" height="104" rx="24" fill="#2b3a72"/>
  <circle cx="18" cy="20" r="2" fill="#f6c453"/><circle cx="90" cy="44" r="1.6" fill="#fff"/><circle cx="13" cy="52" r="1.4" fill="#fff"/><circle cx="36" cy="12" r="1.4" fill="#fff"/><circle cx="72" cy="24" r="1.6" fill="#f6c453"/><circle cx="87" cy="88" r="1.4" fill="#fff"/><circle cx="13" cy="82" r="1.4" fill="#fff"/>
  <path d="M84 10l2.2 5 5 .6-3.8 3.3 1.1 5-4.5-2.6-4.5 2.6 1.1-5-3.8-3.3 5-.6z" fill="#f6c453"/>
  <circle cx="52" cy="70" r="22" fill="#f5eedc"/><circle cx="42" cy="76" r="4.4" fill="#9c8b62"/><circle cx="60" cy="83" r="3.4" fill="#9c8b62"/><circle cx="64" cy="67" r="2.2" fill="#9c8b62"/>
  <g transform="translate(51 67) scale(1.6)"><path d="M0 0c-.6-5 .4-9 0-12" stroke="#3d8a5a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M0-5c-4-.4-6-3-5.8-5.6 3 .2 5.4 2 5.8 5.6z" fill="#3d8a5a"/>
  <path d="M0-12c-5-1-6.4-5.6-4.4-9.4 1.6-2 3.6-1.8 4.4.2.8-2 2.8-2.2 4.4-.2 2 3.8.6 8.4-4.4 9.4z" fill="#e4574f"/>
  <path d="M-2.4-19.4c1.2 1.8 3.6 1.8 4.8 0" stroke="#c43c35" stroke-width="1.1" fill="none"/></g></svg>`;
const BRAND = `<a class="brand" href="/" aria-label="Book612">${ICON}<span class="word"><b>B</b><i>ook</i><b>612</b></span></a>`;

// 주소 '#' 뒤에 담긴 책 카드 읽기
function read(){
  try {
    const b64 = location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    return d && typeof d.t === "string" && d.t ? d : null;
  } catch { return null; }
}

const d = read();
const app = document.getElementById("app");
if(!d){
  app.innerHTML = `${BRAND}<p class="oops">책 카드를 열 수 없어요.<br>받은 링크가 잘리지 않았는지 확인해 주세요.</p>
    <a class="cta" href="/">Book612 둘러보기</a>`;
} else {
  document.title = `『${d.t}』 — Book612 책 카드`;
  // 표지 사진은 책 정보 서비스(카카오, 국립중앙도서관, 알라딘 이미지) 주소일 때만 보여 준다
  const okCover = /^https:\/\/([a-z0-9-]+\.)*(kakaocdn\.net|nl\.go\.kr)\//.test(d.c || "") || /^https:\/\/image\.aladin\.co\.kr\//.test(d.c || "");
  const state = ["지금 읽고 있어요", "다 읽었어요", "읽고 싶은 책이에요"][d.s] || "지금 읽고 있어요";
  app.innerHTML = `${BRAND}
    <h1>${d.r ? "이 책을 추천해요" : ["이 책을 읽고 있어요", "이 책을 다 읽었어요", "이 책이 읽고 싶어요"][d.s] || "이 책을 읽고 있어요"}</h1>
    <article class="card">
      ${d.r ? `<span class="rec">추천하고 싶은 책</span>` : ""}
      <div class="top">
        <div class="cover" style="--c:${COVER_COLORS[hash(d.t) % COVER_COLORS.length]}">${okCover ? `<img src="${esc(d.c)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}${esc(d.t)}</div>
        <div class="t">${d.g ? `<span class="kind">${esc(d.g)}</span>` : ""}<h2>${esc(d.t)}</h2>
          <span class="by">${esc([d.a, d.p].filter(Boolean).join(" · "))}</span>
          <span class="by">${state}</span></div>
      </div>
      ${d.f ? `<span class="label">보낸 사람의 느낌</span><p class="feel">${esc(d.f)}</p>` : ""}
      ${d.q ? `<span class="label">밑줄 친 문장</span><div class="quote"><p><span class="ul">${esc(d.q)}</span></p>${d.qp ? `<div class="page">p.${esc(d.qp)}</div>` : ""}</div>` : ""}
    </article>
    <a class="cta" href="/">나도 나의 별에 독서 기록 남기기</a>
    <p class="small">Book612는 읽은 책과 밑줄 친 문장을 모아 두는 독서 기록장이에요.<br>어린왕자의 작은 별처럼, 나만의 책 별을 가꿔 보세요.</p>`;
}
</script>
</body>
</html>
