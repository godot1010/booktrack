<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>북트랙</title>
<meta name="description" content="읽는 책, 읽은 책, 추천하고 싶은 책과 느낌·글귀를 모아 두는 독서 기록장">
<meta name="theme-color" content="#f1e9d8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 색과 글꼴: 미색 종이 + 잉크색 글씨 + 책갈피 리본 빨강. 어두운 모드는 '밤 독서등' 느낌 */
:root{
  --paper:#f1e9d8; --sheet:#fbf6ea; --ink:#2a251f; --ink-soft:#6b6152;
  --rule:#d8cbb2; --accent:#2f4a6d; --accent-soft:#dfe5ec; --ribbon:#9b2f3a;
  --shade:rgba(42,37,31,.08); --scrim:rgba(20,16,12,.45);
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#1c1915; --sheet:#25211c; --ink:#ece2cf; --ink-soft:#a99c86;
  --rule:#3c352c; --accent:#93b1d6; --accent-soft:#2b3440; --ribbon:#d46c75;
  --shade:rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6); color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding:env(safe-area-inset-top,0px) 16px 0;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-block:8px 110px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}

.topbar{display:flex;align-items:center;gap:10px;padding-block:8px 12px}
.topbar h1{font-size:24px;flex:1;min-width:0}
.topbar h1.small{font-size:17px}
.logo{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;color:var(--ink-soft)}
.iconbtn{border:0;background:none;font-size:20px;padding:4px 8px;color:var(--ink-soft);line-height:1}
.back{border:0;background:none;font-size:22px;padding:2px 8px 2px 0;color:var(--ink)}

/* 서재 탭 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.tab{flex:1;border:0;background:none;padding:10px 4px;font-size:15px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:4px}

/* 책 목록 */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:12px;position:relative}
.row .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row h3{font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.by{font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--ink-soft);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ribbon{position:absolute;top:-1px;right:14px;width:12px;height:22px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.empty{text-align:center;color:var(--ink-soft);padding:40px 10px;display:flex;flex-direction:column;gap:14px;align-items:center}

/* 표지 (사진이 없을 때 색 블록) */
.cover{flex:none;width:54px;height:78px;border-radius:2px 4px 4px 2px;padding:6px 5px 6px 9px;color:#fbf6ea;font-family:var(--f-display);font-size:10px;line-height:1.3;position:relative;overflow:hidden;box-shadow:2px 2px 0 var(--shade);overflow-wrap:anywhere}
.cover::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35)}
.cover.big{width:96px;height:138px;font-size:14px;padding:10px 8px 10px 14px}

.chip{font-size:12px;line-height:1.5;padding:0 7px;border-radius:3px;border:1px solid var(--accent);color:var(--accent);align-self:flex-start;white-space:nowrap}

/* 상세 */
.head{display:flex;gap:16px;align-items:flex-end;margin-bottom:16px}
.head .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.head h2{font-size:22px;line-height:1.3;overflow-wrap:anywhere}
.seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--sheet)}
.seg button{flex:1;border:0;background:none;padding:10px;font-size:14px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--sheet);font-weight:700}
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.recbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:10px;font-size:14px;color:var(--ink-soft)}
.recbtn[aria-pressed="true"]{border-color:var(--ribbon);color:var(--ribbon);font-weight:700}
.mini{width:9px;height:15px;background:currentColor;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.dates{font-size:13px;color:var(--ink-soft);margin-top:-12px;margin-bottom:22px;text-align:center}

section.block{margin-bottom:26px}
.label{font-size:12px;letter-spacing:.14em;color:var(--ink-soft);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.label .hint{letter-spacing:0;font-size:12px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.summary{font-family:var(--f-display);line-height:1.85;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.author{display:flex;gap:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:12px}
.author .t{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px;white-space:pre-wrap}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700}

textarea,.field{width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;resize:vertical;font-size:16px}
textarea.feel{min-height:110px;font-family:var(--f-display);line-height:1.8}

/* 글귀 */
.quote{background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.quote p{margin:0;font-family:var(--f-display);font-size:16px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
.quote p::before{content:"“";color:var(--accent);font-size:22px;line-height:0;margin-right:2px;vertical-align:-6px}
.quote .src{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;gap:8px}
.quote .del{border:0;background:none;color:var(--ink-soft);font-size:12px;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.qadd{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.qadd .r{display:flex;gap:8px}
.qadd .r input{width:90px}

.btn{border:0;border-radius:4px;padding:12px 16px;background:var(--accent);color:var(--sheet);font-weight:700;font-size:15px}
.btn.ghost{background:none;border:1px solid var(--rule);color:var(--ink)}
.btn.danger{background:var(--ribbon)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:4px}
.linkbtn.danger{color:var(--ribbon)}

/* 등록 / 수정 */
.form{display:flex;flex-direction:column;gap:14px}
.form label{font-size:13px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px}
.form .opt{font-size:12px}
.check{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;font-size:15px!important;color:var(--ink)!important}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.soon{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.soon div{border:1px dashed var(--rule);border-radius:4px;padding:12px;text-align:center;color:var(--ink-soft);font-size:14px}
.soon small{display:block;font-size:12px}

/* 설정 */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel p{margin:0;font-size:14px;color:var(--ink-soft)}

/* 아래 메뉴 */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bottom .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
nav.bottom button{border:0;background:none;padding:8px;font-size:13px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.bottom .ico{font-family:var(--f-display);font-size:18px;line-height:1}
nav.bottom .add{background:var(--accent);color:var(--sheet);width:54px;height:54px;border-radius:50%;font-size:28px;line-height:1;justify-content:center;margin-top:-24px;box-shadow:0 3px 8px var(--shade);padding:0}

/* 확인창 */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:16px}
.sheet{background:var(--paper);border-radius:10px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:16px;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet p{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<div class="app"><main id="view"></main></div>

<nav class="bottom" aria-label="메뉴">
  <div class="in">
    <button id="nav-shelf" type="button"><span class="ico">▤</span>내 서재</button>
    <button id="nav-add" class="add" type="button" aria-label="책 등록">+</button>
    <button id="nav-quotes" type="button"><span class="ico">“</span>글귀 모음</button>
  </div>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<div id="modal" class="modal" hidden></div>
<input id="import-file" type="file" accept=".json,application/json" hidden>

<script>
// ───────────────────────── 저장소 (폰 안의 IndexedDB) ─────────────────────────
// 기록은 폰 안에만 저장한다. 서버로 보내지 않는다.
const DB_NAME = "booktrack", STORE = "books";
let dbPromise = null;
function openDB(){
  if(!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, {keyPath: "id"});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function dbAll(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction(STORE).objectStore(STORE).getAll();
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function dbPut(book){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(book);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function dbDelete(id){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

// ───────────────────────── 기본 도구 ─────────────────────────
const GENRES = ["소설", "시", "수필", "인문", "자기계발", "어린이", "만화", "기타"];
const COVER_COLORS = ["#3d5a73", "#5b6b4a", "#8a5a3b", "#6d4a6a", "#2f3a4f", "#4f6b63", "#7a4b3a", "#40536e"];
let books = [];
let saveTimer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const fmtDate = iso => { if(!iso) return ""; const d = new Date(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; };
const findBook = id => books.find(b => b.id === id);

// 제목으로 표지 색을 정한다 (같은 책은 늘 같은 색)
function coverColor(title){
  let h = 0; for(const c of String(title)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return COVER_COLORS[h % COVER_COLORS.length];
}
const cover = (b, big) => `<div class="cover${big ? " big" : ""}" style="background:${coverColor(b.title)}" aria-hidden="true">${esc(b.title)}</div>`;

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800);
}

// 앱 안에서 쓰는 확인창
function ask(message, okLabel, onOk, danger){
  const m = $("#modal");
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><p>${message}</p>
    <div class="two"><button class="btn ghost" type="button" id="ask-no">취소</button>
    <button class="btn${danger ? " danger" : ""}" type="button" id="ask-yes">${esc(okLabel)}</button></div></div>`;
  m.hidden = false;
  $("#ask-no").onclick = () => m.hidden = true;
  $("#ask-yes").onclick = () => { m.hidden = true; onOk(); };
  $("#ask-yes").focus();
}

async function saveBook(b){
  b.updatedAt = nowIso();
  try { await dbPut(b); }
  catch(e){ toast("저장하지 못했어요. 폰 저장 공간을 확인해 주세요."); console.error(e); }
}

// ───────────────────────── 화면 이동 (주소 # 사용 → 폰 뒤로가기 버튼이 동작) ─────────────────────────
function parseRoute(){
  const [name, arg] = location.hash.replace(/^#\/?/, "").split("/");
  return {name: name || "shelf", arg: arg ? decodeURIComponent(arg) : ""};
}
const go = hash => { location.hash = hash; };
const goReplace = hash => { location.replace(hash); };

let lastTab = "reading";
let summaryOpen = false;

function render(){
  const r = parseRoute();
  const v = $("#view");
  if(r.name === "book"){
    const b = findBook(r.arg);
    if(!b) return goReplace("#/shelf/" + lastTab);
    v.innerHTML = detailView(b);
  }
  else if(r.name === "add") v.innerHTML = formView(null);
  else if(r.name === "edit"){
    const b = findBook(r.arg);
    if(!b) return goReplace("#/shelf/" + lastTab);
    v.innerHTML = formView(b);
  }
  else if(r.name === "quotes") v.innerHTML = quotesView();
  else if(r.name === "settings") v.innerHTML = settingsView();
  else {
    if(["reading", "done", "rec"].includes(r.arg)) lastTab = r.arg;
    v.innerHTML = shelfView();
  }
  const cur = r.name === "quotes" ? "nav-quotes" : (r.name === "shelf" || r.name === "book") ? "nav-shelf" : "";
  ["nav-shelf", "nav-quotes"].forEach(id => {
    const el = $("#" + id);
    if(id === cur) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
  });
}
window.addEventListener("hashchange", () => { summaryOpen = false; render(); window.scrollTo(0, 0); });

// ───────────────────────── 내 서재 ─────────────────────────
function shelfView(){
  const tabs = [
    ["reading", "읽는 중", b => b.status === "reading"],
    ["done", "읽음", b => b.status === "done"],
    ["rec", "추천", b => b.rec],
  ];
  const filter = tabs.find(t => t[0] === lastTab)[2];
  const list = books.filter(filter).sort((a, b) =>
    lastTab === "done" ? (b.finishedAt || "").localeCompare(a.finishedAt || "") : (b.createdAt || "").localeCompare(a.createdAt || ""));
  const rows = list.map(b => {
    const q = b.quotes.length ? `<span>· 글귀 ${b.quotes.length}</span>` : "";
    const state = b.status === "done"
      ? `<span class="mono">${fmtDate(b.finishedAt)}</span><span>다 읽음</span>`
      : `<span>읽는 중</span>`;
    return `<button class="row" type="button" data-open="${esc(b.id)}">${b.rec ? '<span class="ribbon" aria-label="추천"></span>' : ""}${cover(b)}
      <div class="info"><span class="chip">${esc(b.genre)}</span><h3>${esc(b.title)}</h3>
      <span class="by">${esc([b.author, b.publisher].filter(Boolean).join(" · "))}</span>
      <div class="meta">${state}${q}</div></div></button>`;
  }).join("");
  const empty = {
    reading: books.length ? "지금 읽는 책이 없어요." : "아직 등록한 책이 없어요.<br>첫 책을 등록해 볼까요?",
    done: "다 읽은 책이 여기에 쌓여요.",
    rec: "책 화면에서 ‘추천하고 싶어요’를 누르면 여기에 모여요.",
  }[lastTab];
  const emptyBtn = lastTab === "reading" ? `<button class="btn" type="button" data-go="#/add">책 등록하기</button>` : "";
  return `<div class="topbar"><h1>내 서재</h1><span class="logo">BOOKTRACK</span>
    <button class="iconbtn" type="button" data-go="#/settings" aria-label="설정과 백업">⚙</button></div>
  <div class="tabs" role="tablist">${tabs.map(([k, l, f]) =>
    `<button class="tab" role="tab" type="button" data-go="#/shelf/${k}" aria-selected="${k === lastTab}">${l}<span class="n">${books.filter(f).length}</span></button>`).join("")}</div>
  <div class="list">${rows || `<div class="empty"><span>${empty}</span>${emptyBtn}</div>`}</div>`;
}

// ───────────────────────── 책 화면 ─────────────────────────
function detailView(b){
  const done = b.status === "done";
  const dates = [b.startedAt && `${fmtDate(b.startedAt)} 시작`, done && b.finishedAt && `${fmtDate(b.finishedAt)} 다 읽음`].filter(Boolean).join(" · ");
  const longSummary = (b.summary || "").length > 80;
  return `<div class="topbar"><button class="back" type="button" data-back aria-label="뒤로">←</button><h1 class="small">책 기록</h1>
    <button class="btn ghost" type="button" data-go="#/edit/${encodeURIComponent(b.id)}" style="padding:7px 12px;font-size:14px">수정</button></div>
  <div class="head">${cover(b, true)}<div class="t"><span class="chip">${esc(b.genre)}</span><h2>${esc(b.title)}</h2>
    <span class="by">${esc([b.author, b.publisher].filter(Boolean).join(" · "))}</span></div></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="읽기 상태">
      <button type="button" data-status="reading" aria-pressed="${!done}">읽는 중</button>
      <button type="button" data-status="done" aria-pressed="${done}">다 읽음</button>
    </div>
    <button class="recbtn" type="button" data-rec aria-pressed="${b.rec}"><span class="mini"></span>${b.rec ? "추천 목록에 있어요" : "추천하고 싶어요"}</button>
  </div>
  ${dates ? `<div class="dates mono">${dates}</div>` : ""}

  ${b.summary ? `<section class="block"><div class="label"><span>줄거리</span>${longSummary ? `<button class="linkbtn" type="button" data-more style="font-size:12px;letter-spacing:0">${summaryOpen ? "접기" : "더 보기"}</button>` : ""}</div>
    <p class="summary ${summaryOpen || !longSummary ? "" : "clamp"}">${esc(b.summary)}</p></section>` : ""}

  ${b.authorBio ? `<section class="block"><div class="label">작가 소개</div>
    <div class="author"><div class="avatar">${esc((b.author || "?")[0])}</div><div class="t"><strong>${esc(b.author)}</strong><span class="by">${esc(b.authorBio)}</span></div></div></section>` : ""}

  <section class="block"><div class="label"><span>느낌</span><span class="hint" id="feel-state"></span></div>
    <textarea id="feel" class="feel" data-feel placeholder="이 책을 읽고 든 생각을 자유롭게 적어 보세요.">${esc(b.feeling)}</textarea>
  </section>

  <section class="block"><div class="label"><span>글귀</span><span class="mono">${b.quotes.length}</span></div>
    <div class="list">${b.quotes.map(q => `<div class="quote"><p>${esc(q.text)}</p><div class="src">
      <button class="del" type="button" data-delquote="${esc(q.id)}">지우기</button><span class="mono">${q.page ? "p." + esc(q.page) : ""}</span></div></div>`).join("")
      || '<div class="empty" style="padding:14px">마음에 드는 문장을 남겨 보세요.</div>'}</div>
    <form class="qadd" data-qform>
      <textarea id="qtext" rows="2" placeholder="마음에 든 문장" required></textarea>
      <div class="r"><input id="qpage" class="field mono" type="number" min="1" placeholder="쪽" inputmode="numeric"><button class="btn" type="submit" style="flex:1">글귀 남기기</button></div>
    </form>
  </section>

  <p style="text-align:center"><button class="linkbtn danger" type="button" data-delbook>이 책 지우기</button></p>`;
}

// ───────────────────────── 책 등록 / 수정 ─────────────────────────
function formView(b){
  const isNew = !b;
  b = b || {title: "", author: "", publisher: "", genre: "소설", summary: "", authorBio: "", status: "reading", rec: false};
  return `<div class="topbar"><button class="back" type="button" data-back aria-label="뒤로">←</button><h1>${isNew ? "책 등록" : "책 정보 수정"}</h1></div>
  ${isNew ? `<div class="soon"><div>바코드 찍기<small>다음 단계에서 나와요</small></div><div>표지 찍기<small>다음 단계에서 나와요</small></div></div>` : ""}
  <form class="form" data-bookform>
    <label>책 제목<input id="f-title" class="field" value="${esc(b.title)}" required autocomplete="off"></label>
    <label>지은이<input id="f-author" class="field" value="${esc(b.author)}" autocomplete="off"></label>
    <label>출판사<input id="f-publisher" class="field" value="${esc(b.publisher)}" autocomplete="off"></label>
    <label>종류<select id="f-genre" class="field">${GENRES.map(g => `<option${g === b.genre ? " selected" : ""}>${g}</option>`).join("")}</select></label>
    ${isNew ? `<div class="seg" role="group" aria-label="읽기 상태">
      <button type="button" data-fstatus="reading" aria-pressed="true">읽는 중</button>
      <button type="button" data-fstatus="done" aria-pressed="false">다 읽음</button></div>
    <label class="check"><input id="f-rec" type="checkbox"> 추천 목록에도 넣기</label>` : ""}
    <label>줄거리 <span class="opt">(안 써도 돼요)</span><textarea id="f-summary" rows="4">${esc(b.summary)}</textarea></label>
    <label>작가 소개 <span class="opt">(안 써도 돼요)</span><textarea id="f-bio" rows="3">${esc(b.authorBio)}</textarea></label>
    <button class="btn wide" type="submit">${isNew ? "서재에 넣기" : "저장하기"}</button>
  </form>`;
}

// ───────────────────────── 글귀 모음 ─────────────────────────
function quotesView(){
  const all = books.flatMap(b => b.quotes.map(q => ({...q, b}))).sort((x, y) => (y.createdAt || "").localeCompare(x.createdAt || ""));
  return `<div class="topbar"><h1>글귀 모음</h1><span class="logo mono">${all.length}개</span></div>
  <div class="list">${all.map(q => `<button class="quote" type="button" data-open="${esc(q.b.id)}"><p>${esc(q.text)}</p>
    <div class="src"><span>『${esc(q.b.title)}』 ${esc(q.b.author)}</span><span class="mono">${q.page ? "p." + esc(q.page) : ""}</span></div></button>`).join("")
    || '<div class="empty">책 화면에서 남긴 글귀가 여기에 모여요.</div>'}</div>`;
}

// ───────────────────────── 설정과 백업 ─────────────────────────
function settingsView(){
  const qCount = books.reduce((n, b) => n + b.quotes.length, 0);
  return `<div class="topbar"><button class="back" type="button" data-back aria-label="뒤로">←</button><h1>설정과 백업</h1></div>
  <div class="list">
    <div class="panel"><strong>기록은 이 폰 안에만 저장돼요</strong>
      <p>로그인이 없고, 기록을 서버로 보내지 않아요. 대신 앱을 지우거나 폰을 바꾸면 기록이 사라지니, 가끔 백업 파일을 만들어 두세요.</p>
      <p class="mono">책 ${books.length}권 · 글귀 ${qCount}개</p></div>
    <div class="panel"><strong>백업 파일 만들기</strong>
      <p>지금까지의 기록을 파일 하나로 저장해요. 카톡 나에게 보내기나 드라이브에 올려 두면 안전해요.</p>
      <button class="btn" type="button" data-export>백업 파일 저장</button></div>
    <div class="panel"><strong>백업 파일 불러오기</strong>
      <p>새 폰에서 백업 파일을 고르면 기록이 돌아와요. 이미 있는 책은 더 최근에 고친 쪽으로 맞춰요.</p>
      <button class="btn ghost" type="button" data-import>백업 파일 고르기</button></div>
  </div>`;
}

function exportBackup(){
  const data = {app: "BOOKTRACK", version: 1, exportedAt: nowIso(), books};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `booktrack-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("백업 파일을 저장했어요");
}

// 옛 기록이나 다른 버전 파일도 안전하게 읽도록 모양을 맞춘다
function normalizeBook(x){
  if(!x || typeof x !== "object" || !x.id || !x.title) return null;
  return {
    id: String(x.id), title: String(x.title), author: String(x.author || ""), publisher: String(x.publisher || ""),
    isbn: String(x.isbn || ""), genre: GENRES.includes(x.genre) ? x.genre : "기타",
    status: x.status === "done" ? "done" : "reading", rec: !!x.rec,
    startedAt: x.startedAt || "", finishedAt: x.finishedAt || "",
    summary: String(x.summary || ""), authorBio: String(x.authorBio || ""), feeling: String(x.feeling || ""),
    quotes: Array.isArray(x.quotes) ? x.quotes.filter(q => q && q.text).map(q => ({id: String(q.id || newId()), text: String(q.text), page: q.page ? String(q.page) : "", createdAt: q.createdAt || ""})) : [],
    createdAt: x.createdAt || nowIso(), updatedAt: x.updatedAt || "",
  };
}

async function importBackup(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast("백업 파일을 읽지 못했어요"); }
  if(!data || data.app !== "BOOKTRACK" || !Array.isArray(data.books)) return toast("북트랙 백업 파일이 아니에요");
  let added = 0, updated = 0;
  for(const raw of data.books){
    const b = normalizeBook(raw); if(!b) continue;
    const cur = findBook(b.id);
    if(!cur){ books.push(b); added++; await dbPut(b); }
    else if((b.updatedAt || "") > (cur.updatedAt || "")){ Object.assign(cur, b); updated++; await dbPut(cur); }
  }
  render();
  toast(`새 책 ${added}권, 고친 책 ${updated}권을 불러왔어요`);
}

// ───────────────────────── 버튼 처리 ─────────────────────────
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t || t.closest("#modal")) return;
  const r = parseRoute();
  const cur = r.name === "book" ? findBook(r.arg) : null;

  if(t.id === "nav-shelf") return go("#/shelf/" + lastTab);
  if(t.id === "nav-quotes") return go("#/quotes");
  if(t.id === "nav-add") return go("#/add");
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.open) return go("#/book/" + encodeURIComponent(t.dataset.open));
  if(t.hasAttribute("data-back")) return history.length > 1 ? history.back() : goReplace("#/shelf/" + lastTab);

  if(t.dataset.fstatus){
    t.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === t));
    return;
  }
  if(t.hasAttribute("data-export")) return exportBackup();
  if(t.hasAttribute("data-import")) return $("#import-file").click();
  if(!cur) return;

  if(t.dataset.status){
    if(cur.status === t.dataset.status) return;
    cur.status = t.dataset.status;
    if(cur.status === "done"){ cur.finishedAt = nowIso(); toast("다 읽은 책으로 옮겼어요"); }
    else { cur.finishedAt = ""; toast("읽는 중으로 옮겼어요"); }
    saveBook(cur); return render();
  }
  if(t.hasAttribute("data-rec")){
    cur.rec = !cur.rec; toast(cur.rec ? "추천 목록에 넣었어요" : "추천 목록에서 뺐어요");
    saveBook(cur); return render();
  }
  if(t.hasAttribute("data-more")){ summaryOpen = !summaryOpen; return render(); }
  if(t.dataset.delquote){
    const id = t.dataset.delquote;
    return ask("이 글귀를 지울까요?", "지우기", () => {
      cur.quotes = cur.quotes.filter(q => q.id !== id); saveBook(cur); render(); toast("글귀를 지웠어요");
    }, true);
  }
  if(t.hasAttribute("data-delbook")){
    return ask(`『${esc(cur.title)}』을(를) 지울까요?<br><small style="color:var(--ink-soft)">느낌과 글귀도 함께 지워지고, 되돌릴 수 없어요.</small>`, "지우기", async () => {
      books = books.filter(b => b !== cur);
      try { await dbDelete(cur.id); } catch(e){ console.error(e); }
      toast("책을 지웠어요"); goReplace("#/shelf/" + lastTab);
    }, true);
  }
});
$("#modal").addEventListener("click", e => { if(e.target.id === "modal") e.target.hidden = true; });
document.addEventListener("keydown", e => { if(e.key === "Escape") $("#modal").hidden = true; });

// 느낌은 쓰는 동안 자동 저장
document.addEventListener("input", e => {
  if(!e.target.hasAttribute("data-feel")) return;
  const r = parseRoute(), cur = findBook(r.arg); if(!cur) return;
  cur.feeling = e.target.value;
  $("#feel-state").textContent = "쓰는 중…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => { await saveBook(cur); const s = $("#feel-state"); if(s) s.textContent = "저장됨"; }, 600);
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, r = parseRoute();

  if(f.hasAttribute("data-qform")){
    const cur = findBook(r.arg); if(!cur) return;
    const text = $("#qtext").value.trim(); if(!text) return;
    cur.quotes.push({id: newId(), text, page: $("#qpage").value.trim(), createdAt: nowIso()});
    await saveBook(cur); render(); toast("글귀를 남겼어요");
  }

  if(f.hasAttribute("data-bookform")){
    const title = $("#f-title").value.trim();
    if(!title){ $("#f-title").focus(); return; }
    const fields = {
      title, author: $("#f-author").value.trim(), publisher: $("#f-publisher").value.trim(),
      genre: $("#f-genre").value, summary: $("#f-summary").value.trim(), authorBio: $("#f-bio").value.trim(),
    };
    if(r.name === "edit"){
      const cur = findBook(r.arg); if(!cur) return;
      Object.assign(cur, fields); await saveBook(cur);
      toast("저장했어요"); history.back();
    } else {
      const done = f.querySelector('[data-fstatus="done"]').getAttribute("aria-pressed") === "true";
      const b = normalizeBook({...fields, id: newId(), status: done ? "done" : "reading", rec: $("#f-rec").checked,
        startedAt: nowIso(), finishedAt: done ? nowIso() : "", quotes: [], createdAt: nowIso()});
      books.push(b); await saveBook(b);
      lastTab = done ? "done" : "reading";
      toast("서재에 넣었어요"); goReplace("#/book/" + encodeURIComponent(b.id));
    }
  }
});

$("#import-file").addEventListener("change", e => {
  const file = e.target.files[0]; e.target.value = "";
  if(file) importBackup(file);
});

// ───────────────────────── 시작 ─────────────────────────
(async () => {
  try { books = (await dbAll()).map(normalizeBook).filter(Boolean); }
  catch(e){ console.error(e); toast("기록을 불러오지 못했어요"); }
  // 브라우저가 저장 공간을 마음대로 비우지 않게 요청
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
})();

if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
