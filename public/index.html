function exportBackup(){
  const data = {app: "BOOKTRACK", version: 1, exportedAt: nowIso(), books, goals: loadGoals()};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `booktrack-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  try { localStorage.setItem("bt_last_backup", nowIso()); } catch {}
  toast("백업 파일을 저장했어요");
  if(parseRoute().name === "me") render();
}

// 옛 기록이나 다른 버전 파일도 안전하게 읽도록 모양을 맞춘다
function normalizeBook(x){
  if(!x || typeof x !== "object" || !x.id || !x.title) return null;
  return {
    id: String(x.id), title: String(x.title), author: String(x.author || ""), publisher: String(x.publisher || ""),
    isbn: String(x.isbn || ""), format: ["paper", "ebook", "audio"].includes(x.format) ? x.format : "paper", cover: /^https:\/\//.test(x.cover || "") ? String(x.cover) : "", genre: GENRES.includes(x.genre) ? x.genre : "기타",
    status: ["want", "reading", "done"].includes(x.status) ? x.status : "reading", rec: !!x.rec,
    startedAt: x.startedAt || "", finishedAt: x.finishedAt || "",
    summary: String(x.summary || ""), authorBio: String(x.authorBio || ""),
    authorBioUrl: /^https:\/\/ko\.(m\.)?wikipedia\.org\//.test(x.authorBioUrl || "") ? String(x.authorBioUrl) : "", feeling: String(x.feeling || ""),
    quotes: Array.isArray(x.quotes) ? x.quotes.filter(q => q && q.text).map(q => ({id: String(q.id || newId()), text: String(q.text), page: q.page ? String(q.page) : "", createdAt: q.createdAt || ""})) : [],
    createdAt: x.createdAt || nowIso(), updatedAt: x.updatedAt || "",
  };
}

async function importBackup(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast("백업 파일을 읽지 못했어요"); }
  if(!data || data.app !== "BOOKTRACK" || !Array.isArray(data.books)) return toast("Book612 백업 파일이 아니에요");
  // 목표는 이 폰에 없는 해만 백업에서 가져온다
  if(data.goals && typeof data.goals === "object"){ const g = loadGoals(); for(const [y, n] of Object.entries(data.goals)) if(!g[y] && +n > 0) g[y] = +n; saveGoals(g); }
  let added = 0, updated = 0;
  for(const raw of data.books){
    const b = normalizeBook(raw); if(!b) continue;
    const cur = findBook(b.id);
    if(!cur){ books.push(b); added++; await dbPut(b); }
    else if((b.updatedAt || "") > (cur.updatedAt || "")){ Object.assign(cur, b); updated++; await dbPut(cur); }
  }
  render();
  toast(`새 책 ${added}권, 고친 책 ${updated}권을 불러왔어요`);
}

// ───────────────────────── 버튼 처리 ─────────────────────────
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t || t.closest("#modal")) return;
  const r = parseRoute();
  const cur = r.name === "book" ? findBook(r.arg) : null;

  if(t.id === "nav-home") return go("#/home");
  if(t.id === "nav-shelf") return go("#/shelf/" + shelfFilter);
  if(t.id === "nav-quotes") return go("#/quotes");
  if(t.id === "nav-me") return go("#/me");
  if(t.id === "nav-add") return go("#/scan");
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.goReplace) return goReplace(t.dataset.goReplace);
  if(t.dataset.open) return go("#/book/" + encodeURIComponent(t.dataset.open));
  if(t.hasAttribute("data-back")) return history.length > 1 ? history.back() : goReplace("#/home");
  if(t.dataset.quickquote){ const b = findBook(t.dataset.quickquote); if(b) openQuoteSheet(b); return; }
  if(t.dataset.pop){ popularPeriod = t.dataset.pop; if(r.name === "popular") return goReplace("#/popular/" + popularPeriod); showPopular(); return loadPopular(popularPeriod); }
  if(t.dataset.popItem){ const it = popular[popularPeriod]?.items[+t.dataset.popItem]; if(it) openPopularSheet(it); return; }

  if(t.dataset.lookitem && lookupItems){ const it = lookupItems[+t.dataset.lookitem]; if(it) pickLookup(it); return; }
  if(t.hasAttribute("data-relist")){ scanState = {status: "idle"}; showScanResult(); $("#lookup-list").innerHTML = lookupListHtml(); return; }
  if(t.dataset.fstatus || t.dataset.fformat){
    t.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === t));
    return;
  }
  if(t.hasAttribute("data-shuffle")){ quoteShift++; bumpSunset(); render(); $(".today")?.classList.add("setting"); return; }
  if(t.dataset.pickgenre && scanState.book){
    scanState.book.genre = t.dataset.pickgenre;
    t.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === t));
    return;
  }
  if(t.hasAttribute("data-scanagain")){ scanState = {status: "idle"}; showScanResult(); return startScan(); }
  if(t.hasAttribute("data-manual-isbn")){ draftIsbn = scanState.isbn || ""; return goReplace("#/add"); }
  if(t.hasAttribute("data-addfound") && scanState.status === "found"){
    const s = scanState.book;
    const st = pickedStatus($("#scan-result")), fm = pickedFormat($("#scan-result"));
    rememberFormat(fm);
    const b = normalizeBook({id: newId(), title: s.title, author: s.author, publisher: s.publisher, isbn: s.isbn, cover: s.cover,
      summary: s.summary, authorBio: s.authorBio, authorBioUrl: s.authorBioUrl, genre: s.genre, format: fm, status: st, rec: $("#found-rec").checked,
      ...newDates(st), quotes: [], createdAt: nowIso()});
    books.push(b); saveBook(b);
    scanState = {status: "idle"};
    plantedScene(st); return goReplace("#/book/" + encodeURIComponent(b.id));
  }
  if(t.hasAttribute("data-export")) return exportBackup();
  if(t.hasAttribute("data-goal")) return openGoalSheet();
  if(t.hasAttribute("data-story")) return openStory();
  if(t.hasAttribute("data-foxpick")) return openFoxPick();
  if(t.hasAttribute("data-import")) return $("#import-file").click();
  if(!cur) return;

  if(t.dataset.status){
    if(cur.status === t.dataset.status) return;
    cur.status = t.dataset.status;
    if(cur.status === "done"){ cur.finishedAt = nowIso(); cur.startedAt ||= nowIso(); celebrate("flower", "꽃이 피었어요", "다 읽었어요. 별 하나가 나의 별 지도에 박혔어요"); }
    else if(cur.status === "reading"){ cur.finishedAt = ""; cur.startedAt ||= nowIso(); celebrate("sprout", "새싹이 돋았어요", "오늘부터 읽는 중이에요"); }
    else { cur.startedAt = ""; cur.finishedAt = ""; toast("읽고 싶은 책으로 옮겼어요"); }
    saveBook(cur); return render();
  }
  if(t.hasAttribute("data-rec")){
    cur.rec = !cur.rec; toast(cur.rec ? "추천 목록에 넣었어요" : "추천 목록에서 뺐어요");
    saveBook(cur); return render();
  }
  if(t.hasAttribute("data-more")){ summaryOpen = !summaryOpen; return render(); }
  if(t.hasAttribute("data-findbio")){
    t.disabled = true; t.textContent = "찾는 중…";
    return fetchAuthorBio(cur.author, cur.title).then(async bio => {
      if(bio){ cur.authorBio = bio.bio; cur.authorBioUrl = bio.url; await saveBook(cur); toast("작가 소개를 가져왔어요"); }
      else toast("위키백과에서 찾지 못했어요. 수정에서 직접 쓸 수 있어요");
      if(findBook(cur.id) && parseRoute().arg === cur.id) render();
    });
  }
  if(t.hasAttribute("data-share")) return openShare(cur);
  if(t.dataset.delquote){
    const id = t.dataset.delquote;
    return ask(`<span class="ask-pic">${PIC_SNAKE}</span>이 문장을 지울까요?<small>지운 문장은 되돌릴 수 없어요.</small>`, "지우기", () => {
      cur.quotes = cur.quotes.filter(q => q.id !== id); saveBook(cur); render(); toast("문장을 지웠어요");
    }, true);
  }
  if(t.hasAttribute("data-delbook")){
    return ask(`<span class="ask-pic">${PIC_SNAKE}</span>『${esc(cur.title)}』을(를) 지울까요?<small>한번 떠난 책은 돌아오지 않아요. 느낌과 길들인 문장도 함께 지워져요.</small>`, "지우기", async () => {
      books = books.filter(b => b !== cur);
      try { await dbDelete(cur.id); } catch(e){ console.error(e); }
      toast("책을 지웠어요"); goReplace("#/shelf/" + shelfFilter);
    }, true);
  }
});
$("#modal").addEventListener("click", e => { if(e.target.id === "modal"){ stopVoice(); e.target.hidden = true; } });
document.addEventListener("keydown", e => { if(e.key === "Escape"){ stopVoice(); $("#modal").hidden = true; } });

// 느낌은 쓰는 동안 자동 저장
document.addEventListener("input", e => {
  // 찾기: 글자를 칠 때마다 결과만 다시 그림 (입력 칸은 그대로 둠)
  if(e.target.id === "search-input"){ searchQuery = e.target.value; $("#results").innerHTML = searchResults(); return; }
  // ISBN 네모칸: 숫자만 남겨 13칸에 채우고, 13자리가 되면 검증해서 바로 찾는다
  if(e.target.id === "isbn-input"){
    const digits = e.target.value.replace(/\D/g, "").slice(0, 13);
    e.target.value = digits;
    $("#isbn-cells").innerHTML = isbnCells(digits);
    const m = $("#isbn-msg"); m.textContent = ""; m.style.color = "";
    if(digits.length === 13){
      if(isbn13ok(digits)) $("[data-isbnform]").requestSubmit();
      else { m.textContent = "숫자가 맞지 않아요. 바코드 아래 숫자를 다시 확인해 주세요."; m.style.color = "var(--coral-ink)"; }
    }
    return;
  }
  if(!e.target.hasAttribute("data-feel")) return;
  const r = parseRoute(), cur = findBook(r.arg); if(!cur) return;
  cur.feeling = e.target.value;
  $("#feel-state").textContent = "쓰는 중…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => { await saveBook(cur); const s = $("#feel-state"); if(s) s.textContent = "저장됨"; }, 600);
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, r = parseRoute();

  if(f.hasAttribute("data-lookupform")){
    const q = $("#lookup-input").value.replace(/\s+/g, " ").trim();
    if(q.length < 2){ toast("두 글자 이상 넣어 주세요"); return; }
    $("#lookup-input").blur();
    // ISBN 숫자를 넣었으면 바로 그 책으로
    const digits = q.replace(/[^0-9Xx]/g, "");
    if(/^97[89]\d{10}$/.test(digits) && isbn13ok(digits)){ lookupQuery = q; return lookupIsbn(digits); }
    return runLookup(q);
  }

  if(f.hasAttribute("data-isbnform")){
    let v = $("#isbn-input").value.replace(/[^0-9Xx]/g, "").toUpperCase();
    if(!/^(\d{13}|\d{9}[\dX])$/.test(v) || (v.length === 13 && !isbn13ok(v))){ toast("숫자 13자리를 다시 확인해 주세요"); return; }
    stopScan(); $("#isbn-input").blur();
    return lookupIsbn(v);
  }

  // 밑줄 긋기 창
  if(f.hasAttribute("data-quickform")){
    stopVoice();
    const b = findBook($("#modal").dataset.book); if(!b) return;
    const text = $("#qq-text").value.trim();
    if(!text){ $("#qq-text").focus(); toast("문장을 적어 주세요"); return; }
    b.quotes.push({id: newId(), text, page: $("#qq-page").value.trim(), createdAt: nowIso()});
    await saveBook(b);
    $("#modal").hidden = true; render(); celebrate("fox", "길들였어요", "이 문장은 이제 나에게 하나뿐인 문장이에요");
    return;
  }

  if(f.hasAttribute("data-bookform")){
    const title = $("#f-title").value.trim();
    if(!title){ $("#f-title").focus(); return; }
    const fields = {
      title, author: $("#f-author").value.trim(), publisher: $("#f-publisher").value.trim(),
      genre: $("#f-genre").value, format: pickedFormat(f), summary: $("#f-summary").value.trim(), authorBio: $("#f-bio").value.trim(),
    };
    if(r.name === "edit"){
      const cur = findBook(r.arg); if(!cur) return;
      // 위키백과 소개를 손으로 고쳤으면 더 이상 '위키백과에서 가져옴'이 아니다
      if(fields.authorBio !== cur.authorBio) fields.authorBioUrl = "";
      Object.assign(cur, fields); await saveBook(cur);
      toast("저장했어요"); history.back();
    } else {
      const st = pickedStatus(f); rememberFormat(fields.format);
      const b = normalizeBook({...fields, id: newId(), isbn: draftIsbn, status: st, rec: $("#f-rec").checked,
        ...newDates(st), quotes: [], createdAt: nowIso()});
      draftIsbn = "";
      books.push(b); await saveBook(b);
      plantedScene(st); goReplace("#/book/" + encodeURIComponent(b.id));
    }
  }
});

document.addEventListener("change", e => {

// 반짝이는 작은 별: 정해 둔 큰 별 + 흩뿌린 작은 별 n개(seed가 같으면 늘 같은 자리). skip(x, y)가 참인 자리(땅·소행성)는 비운다
const STARS = (list, n = 0, seed = 1, skip = () => false) => {
  const extra = [];
  for(let i = 0; extra.length < n && i < n * 4; i++){
    const x = scatter(seed * 997 + i * 3) * 340, y = scatter(seed * 997 + i * 3 + 1) * 230;
    if(!skip(x, y)) extra.push([+x.toFixed(1), +y.toFixed(1), scatter(seed * 997 + i * 3 + 2) > .75 ? 1.1 : .65]);
  }
  return `<g fill="#fff">${[...list, ...extra].map(([x, y, r], i) => `<circle class="st-tw" style="animation-delay:${((i * .37) % 2.6).toFixed(2)}s" cx="${x}" cy="${y}" r="${r}"${r < .8 ? ' opacity=".75"' : ""}/>`).join("")}</g>`;
};

    <g class="st-shoot"><path d="M300 30l-34 17" stroke="#f6c453" stroke-width="2" stroke-linecap="round"/><circle cx="300" cy="30" r="2.4" fill="#fff"/></g>

  {svg: `${STARS([[40,45,1.4],[300,150,1.3],[70,150,1],[110,80,1.1],[160,22,1.2],[30,210,1]], 30, 3, (x, y) => Math.hypot(x - 170, y - 182) < 70 || (x > 150 && x < 270 && y > 40 && y < 125))}

const storySeen = () => { try { return localStorage.getItem("bt_story_seen") === "1"; } catch { return true; } };
function openStory(){
  let i = 0;
  const el = document.createElement("div");
  el.className = "story"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", "첫 만남 이야기");
  // 화면 전체 밤하늘에도 작은 별을 뿌린다(그림 밖 위아래가 비어 보이지 않게)
  const sky = Array.from({length: 46}, (_, i) => { const r = scatter(i * 5 + 401) > .82 ? 1.5 : .9;
    return `<circle class="st-tw" style="animation-delay:${((i * .43) % 2.8).toFixed(2)}s" cx="${(scatter(i * 5 + 402) * 400).toFixed(1)}" cy="${(scatter(i * 5 + 403) * 800).toFixed(1)}" r="${r}" fill="#fff" opacity="${r > 1 ? .9 : .6}"/>`; }).join("");
  el.innerHTML = `<svg class="story-sky" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${sky}</svg>
    <div class="in"><button class="skip" type="button" data-st="skip">건너뛰기</button><div class="stage"></div>
    <div class="foot"><div class="dots">${STORY.map(() => "<i></i>").join("")}</div><button class="nx" type="button" data-st="next"></button></div></div>`;
  document.body.appendChild(el);
  const show = n => {
    i = n;
    el.querySelector(".stage").innerHTML = `<svg class="scene" viewBox="0 0 340 250" aria-hidden="true">${STORY[n].svg}</svg>
      <div class="txt"><h2>${STORY[n].h}</h2><p>${STORY[n].p}</p></div>`;
    el.querySelectorAll(".dots i").forEach((d, k) => d.classList.toggle("on", k === n));
    el.querySelector(".nx").textContent = n < STORY.length - 1 ? "다음" : books.length ? "Book612로 가기" : "첫 책 심기";
    el.querySelector(".skip").hidden = n === STORY.length - 1;
  };
  const close = () => {
    try { localStorage.setItem("bt_story_seen", "1"); } catch {}
    el.remove();
  };
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-st]"); if(!b) return;
    if(b.dataset.st === "skip") return show(STORY.length - 1);
    if(i < STORY.length - 1) return show(i + 1);
    close(); if(!books.length) go("#/scan");
  });
  // 옆으로 밀어서 넘기기
  let x0 = null;
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive: true});
  el.addEventListener("touchend", e => {
    if(x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(dx < -50 && i < STORY.length - 1) show(i + 1); else if(dx > 50 && i > 0) show(i - 1);
  });
  show(0);
  el.querySelector(".nx").focus();
}

// ───────────────────────── 시작 ─────────────────────────
(async () => {
  try { books = (await dbAll()).map(normalizeBook).filter(Boolean); }
  catch(e){ console.error(e); toast("기록을 불러오지 못했어요"); }
  // 브라우저가 저장 공간을 마음대로 비우지 않게 요청
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render(true);
  if(!storySeen()) openStory();
})();

if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
