<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>북트랙</title>
<meta name="description" content="읽는 책, 읽은 책, 추천하고 싶은 책과 느낌·밑줄 친 문장을 모아 두는 독서 기록장">
<meta name="theme-color" content="#f1e9d8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 색과 글꼴: 미색 종이 + 잉크색 글씨 + 책갈피 리본 빨강 + 나무 책장. 어두운 모드는 '밤 독서등' 느낌 */
:root{
  --paper:#f1e9d8; --sheet:#fbf6ea; --ink:#2a251f; --ink-soft:#6b6152; --ink-faint:#9a8f7c;
  --rule:#ddd0b7; --accent:#2f4a6d; --accent-soft:#dfe5ec; --ribbon:#9b2f3a;
  --plank:#b99b6b; --plank-edge:#8f7550;
  --shade:rgba(60,45,25,.10); --scrim:rgba(20,16,12,.45);
  --grain:rgba(110,85,50,.07);
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#1b1814; --sheet:#25211c; --ink:#ece2cf; --ink-soft:#ab9e88; --ink-faint:#7c7262;
  --rule:#3a332a; --accent:#93b1d6; --accent-soft:#2a333f; --ribbon:#d46c75;
  --plank:#5a4a36; --plank-edge:#3d3225;
  --shade:rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); --grain:rgba(255,240,210,.035); color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-color:var(--paper);
  background-image:radial-gradient(var(--grain) 1px,transparent 1.2px),radial-gradient(var(--grain) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;
  padding:env(safe-area-inset-top,0px) 16px 0;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-block:4px 120px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
svg{display:block}
@media (prefers-reduced-motion:no-preference){
  .view-in{animation:rise .28s ease-out}
  @keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
}

/* ── 위쪽 머리 */
.masthead{padding-block:14px 18px;display:flex;flex-direction:column;gap:4px}
.masthead .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--ink-soft)}
.masthead h1{font-size:32px;letter-spacing:-.01em}
.stats{display:flex;gap:18px;margin-top:10px;padding-top:12px;border-top:1px solid var(--rule)}
.stat{display:flex;flex-direction:column;gap:0}
.stat b{font-family:var(--f-display);font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--ink-soft)}
.topbar{display:flex;align-items:center;gap:10px;padding-block:10px 12px}
.topbar h1{font-size:20px;flex:1;min-width:0}
.iconbtn{border:0;background:none;padding:8px;color:var(--ink-soft);border-radius:50%;display:flex}
.iconbtn:active{background:var(--shade)}
.back{border:0;background:none;padding:8px 8px 8px 0;color:var(--ink);display:flex}

/* ── 서재 탭 (책갈피 모양 표시) */
.tabs{display:flex;gap:22px;margin-bottom:18px;border-bottom:1px solid var(--rule)}
.tab{border:0;background:none;padding:6px 2px 12px;font-size:16px;color:var(--ink-faint);position:relative;font-family:var(--f-display)}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-left:5px;vertical-align:2px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:10px;height:16px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}

/* ── 표지 (사진이 없을 때 그려 주는 책 표지) */
.cover{position:relative;flex:none;aspect-ratio:2/3;background:var(--c);color:#fbf6ea;border-radius:2px 5px 5px 2px;overflow:hidden;
  display:flex;flex-direction:column;padding:var(--pad,13% 10% 10% 17%);font-family:var(--f-display);
  box-shadow:0 1px 1px rgba(0,0,0,.18),0 8px 16px -8px rgba(40,28,15,.55)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8%;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12) 55%,rgba(0,0,0,.08))}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.16),transparent 38%,transparent 70%,rgba(0,0,0,.14));pointer-events:none}
.cover .ct{font-weight:700;font-size:var(--ts);line-height:1.28;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cover .ca{margin-top:auto;font-size:var(--as);opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover.l1 .ct{border-block:1px solid rgba(255,255,255,.45);padding-block:6% 7%}
.cover.l2{justify-content:flex-end}
.cover.l2 .ca{margin-top:0;order:-1;margin-bottom:auto}
.cover.l2::after{background:linear-gradient(180deg,rgba(255,255,255,.14) 0 30%,transparent 30%),linear-gradient(110deg,rgba(255,255,255,.12),transparent 40%,rgba(0,0,0,.14))}
.cover.sm{width:46px;--ts:7px;--pad:6px 4px 4px 8px}.cover.sm .ca{display:none}
.cover.md{width:76px;--ts:10.5px;--as:8px;--pad:10px 7px 7px 13px}
.cover.fill{--ts:12px;--as:9px}
.cover.lg{width:150px;--ts:19px;--as:12px;--pad:20px 15px 15px 25px;margin-inline:auto;box-shadow:0 1px 2px rgba(0,0,0,.2),0 18px 30px -12px rgba(40,28,15,.6)}
.cover.fill{width:100%}

/* ── 읽는 중 / 추천 카드 */
.list{display:flex;flex-direction:column;gap:14px}
.card{display:flex;gap:16px;align-items:stretch;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px;position:relative;box-shadow:0 1px 0 var(--shade)}
.card:active{transform:translateY(1px)}
.card .cover{align-self:flex-start}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.card h3{font-size:18px;line-height:1.35;overflow-wrap:anywhere}
.kind{font-size:11px;letter-spacing:.14em;color:var(--accent)}
.by{font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--ink-faint);margin-top:auto;padding-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.snip{font-family:var(--f-display);font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ribbon{position:absolute;top:-1px;right:16px;width:12px;height:24px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%)}

/* ── 읽음: 나무 책장 */
.year{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 12px}
.year h2{font-size:18px}
.year span{font-size:12px;color:var(--ink-soft)}
.shelf{margin-bottom:28px}
.shelf-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;padding:0 10px;position:relative}
.shelf-row::after{content:"";grid-column:1/-1;height:10px;margin:0 -10px;border-radius:2px;
  background:linear-gradient(180deg,var(--plank) 0 70%,var(--plank-edge) 70%);box-shadow:0 8px 10px -6px rgba(40,28,15,.45)}
.shelf-row + .shelf-row{margin-top:22px}
.spot{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;position:relative}
.spot .ribbon{right:10%;height:20px;width:10px;z-index:1}
.spot .cover{box-shadow:0 1px 1px rgba(0,0,0,.2),3px 0 6px -3px rgba(40,28,15,.45)}
.spot:active .cover{transform:translateY(-3px)}

/* ── 빈 화면 */
.empty{text-align:center;color:var(--ink-soft);padding:36px 10px 20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{margin:0;font-family:var(--f-display);font-size:16px;line-height:1.8}

/* ── 책 화면 */
.hero{margin-inline:-16px;padding:0 16px 26px;text-align:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,var(--paper)) 0%,color-mix(in srgb,var(--c) 10%,var(--paper)) 70%,transparent 100%)}
.hero .topbar{text-align:left}
.hero h2{font-size:25px;line-height:1.3;margin-top:20px;overflow-wrap:anywhere}
.hero .by{margin-top:4px;display:block;font-size:14px}
.hero .kind{display:block;margin-top:14px}
.seg{display:flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--sheet)}
.seg button{flex:1;border:0;background:none;padding:9px;font-size:14px;color:var(--ink-soft);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.controls{display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}
.recbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--rule);background:none;border-radius:999px;padding:9px;font-size:14px;color:var(--ink-soft)}
.recbtn[aria-pressed="true"]{border:1px solid var(--ribbon);color:var(--ribbon);font-weight:700;background:color-mix(in srgb,var(--ribbon) 7%,transparent)}
.mini{width:9px;height:15px;background:currentColor;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.dates{font-size:12px;color:var(--ink-faint);text-align:center;margin-bottom:30px}

section.block{margin-bottom:32px}
.label{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--f-display);font-size:15px;font-weight:700}
.label::after{content:"";flex:1;height:1px;background:var(--rule);order:1}
.label .side{order:2;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--ink-faint)}
.label .side button{font-size:12px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.summary{font-family:var(--f-display);line-height:1.9;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.author{display:flex;gap:14px;align-items:flex-start}
.author .t{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px;white-space:pre-wrap}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:18px}

textarea,.field{width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;resize:vertical;font-size:16px}
textarea.feel{min-height:160px;font-family:var(--f-display);line-height:32px;padding:4px 14px;border-radius:4px;
  background:repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px) var(--sheet);background-attachment:local;background-position:0 4px}

/* ── 밑줄 (마음에 든 문장) */
.quote{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:18px 18px 12px 18px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;position:relative}
.quote::before{content:"“";position:absolute;top:2px;left:12px;font-family:var(--f-display);font-size:46px;line-height:1;color:var(--accent);opacity:.28}
.quote p{margin:0;font-family:var(--f-display);font-size:16.5px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;padding-left:14px}
.quote .src{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:14px}
.quote .book{display:flex;align-items:center;gap:8px;min-width:0}
.quote .book i{flex:none;width:8px;height:12px;border-radius:1px;background:var(--c)}
.quote .book span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote .del{border:0;background:none;color:var(--ink-faint);font-size:12px;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.qadd{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.qadd .r{display:flex;gap:8px}
.qadd .r input{width:90px}

.btn{border:0;border-radius:999px;padding:12px 20px;background:var(--accent);color:var(--sheet);font-weight:700;font-size:15px}
.btn.ghost{background:none;border:1px solid var(--rule);color:var(--ink)}
.btn.danger{background:var(--ribbon)}
.btn.wide{width:100%}
.btn.sm{padding:7px 14px;font-size:13px}
.btn:active{transform:translateY(1px)}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:4px}
.linkbtn.danger{color:var(--ink-faint)}

/* ── 밑줄 표시: 연필로 그은 듯한 빨간 밑줄 */
.ul{background-image:linear-gradient(transparent 64%,color-mix(in srgb,var(--ribbon) 26%,transparent) 64% 90%,transparent 90%);
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
mark{background:color-mix(in srgb,var(--ribbon) 22%,transparent);color:inherit;border-radius:2px;padding:0 1px}

/* ── 오늘의 밑줄 */
.today{position:relative;margin:0 0 24px;border-radius:6px;padding:16px 16px 12px;
  background:color-mix(in srgb,var(--c) 13%,var(--sheet));border:1px solid color-mix(in srgb,var(--c) 28%,var(--rule))}
.today .head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.today .eyebrow{color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.today .open{display:block;width:100%;border:0;background:none;padding:0;text-align:left}
.today .open p{margin:0;font-family:var(--f-display);font-size:17.5px;line-height:1.95;overflow-wrap:anywhere}
.today .src{display:block;margin-top:10px;font-size:12px;color:var(--ink-soft)}
.shuffle{border:0;background:none;color:var(--ink-soft);font-size:12px;display:flex;align-items:center;gap:4px;padding:4px 2px}

/* ── 찾기 */
.searchbar{display:flex;align-items:center;gap:8px;flex:1;background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:0 14px}
.searchbar input{flex:1;min-width:0;border:0;background:none;padding:11px 0;font-size:16px;outline:none}
.searchbar svg{flex:none;color:var(--ink-faint)}
.result-head{font-family:var(--f-display);font-weight:700;font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.result-head::after{content:"";flex:1;height:1px;background:var(--rule)}
.result-head span{order:2;font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--ink-faint)}
.feel-hit{display:block;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.feel-hit p{margin:4px 0 0;font-family:var(--f-display);font-size:14.5px;line-height:1.8;color:var(--ink-soft)}
.feel-hit strong{font-size:14px}
.hint{color:var(--ink-faint);font-size:14px;text-align:center;padding:30px 10px;line-height:1.8}

/* ── 등록 / 수정 */
.form{display:flex;flex-direction:column;gap:14px}
.form label{font-size:13px;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px}
.form .opt{font-size:12px;color:var(--ink-faint)}
.form .group{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px}
.form .group .field,.form .group textarea{background:var(--paper)}
.check{flex-direction:row!important;align-items:center;gap:8px!important;font-size:15px!important;color:var(--ink)!important}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.ways{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}
.way{border:1px solid var(--rule);border-radius:8px;padding:12px 6px;text-align:center;font-size:13px;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:6px;background:none}
.way small{font-size:11px}
.way.on{border-color:var(--accent);color:var(--accent);background:var(--sheet);font-weight:700}

/* ── 설정 */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel strong{font-family:var(--f-display);font-size:16px}
.panel p{margin:0;font-size:14px;color:var(--ink-soft)}

/* ── 아래 메뉴 */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--rule);padding:4px 16px calc(4px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bottom .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
nav.bottom button{border:0;background:none;padding:8px;font-size:12px;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.bottom .add{background:var(--ribbon);color:#fbf6ea;width:56px;height:56px;border-radius:50%;justify-content:center;margin-top:-26px;box-shadow:0 6px 14px -4px rgba(120,30,40,.5);padding:0;border:3px solid var(--paper)}

/* ── 확인창, 알림 */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:16px}
.sheet{background:var(--paper);border-radius:14px;padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:18px;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet p{margin:0;font-family:var(--f-display);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:20px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<div class="app"><main id="view"></main></div>

<nav class="bottom" aria-label="메뉴">
  <div class="in">
    <button id="nav-shelf" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16M8 4v16M12.5 5l4 15M3 20h18"/></svg>내 서재</button>
    <button id="nav-add" class="add" type="button" aria-label="책 등록">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="nav-quotes" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v7a5 5 0 0 0 10 0V4"/><path d="M4 20h16" stroke-width="2.2"/></svg>밑줄</button>
  </div>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<div id="modal" class="modal" hidden></div>
<input id="import-file" type="file" accept=".json,application/json" hidden>

<script>
// ───────────────────────── 저장소 (폰 안의 IndexedDB) ─────────────────────────
// 기록은 폰 안에만 저장한다. 서버로 보내지 않는다.
const DB_NAME = "booktrack", STORE = "books";
let dbPromise = null;
function openDB(){
  if(!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, {keyPath: "id"});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function dbAll(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction(STORE).objectStore(STORE).getAll();
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function dbPut(book){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(book);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function dbDelete(id){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

const COVER_COLORS = ["#3d5a73", "#5b6b4a", "#8a5a3b", "#6d4a6a", "#2f3a4f", "#4f6b63", "#7a4b3a", "#40536e", "#7b6a3c", "#5a3f4f"];

let books = [];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const fmtDate = iso => { if(!iso) return ""; const d = new Date(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; };
const fmtMonthDay = iso => { const d = new Date(iso); return `${d.getMonth()+1}월 ${d.getDate()}일`; };

// 제목으로 표지 색과 모양을 정한다 (같은 책은 늘 같은 표지)
function titleHash(title){ let h = 0; for(const c of String(title)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
const coverColor = title => COVER_COLORS[titleHash(title) % COVER_COLORS.length];
function cover(b, size){
  const layout = (titleHash(b.title) >> 3) % 3;
  return `<div class="cover ${size} l${layout}" style="--c:${coverColor(b.title)}" aria-hidden="true">
    <span class="ct">${esc(b.title)}</span><span class="ca">${esc(b.author)}</span></div>`;
}

// ───────────────────────── 화면 이동 (주소 # 사용 → 폰 뒤로가기 버튼이 동작) ─────────────────────────
function parseRoute(){
  const [name, arg] = location.hash.replace(/^#\/?/, "").split("/");
  return {name: name || "shelf", arg: arg ? decodeURIComponent(arg) : ""};
}
const go = hash => { location.hash = hash; };
const goReplace = hash => { location.replace(hash); };

let lastTab = "reading";
let summaryOpen = false;

function render(animate){
  const r = parseRoute();
  const v = $("#view");
  if(r.name === "book"){
    const b = findBook(r.arg);
    if(!b) return goReplace("#/shelf/" + lastTab);
    v.innerHTML = detailView(b);
  }
  else if(r.name === "add") v.innerHTML = formView(null);
  else if(r.name === "edit"){
    const b = findBook(r.arg);
    if(!b) return goReplace("#/shelf/" + lastTab);
    v.innerHTML = formView(b);
  }
  else if(r.name === "quotes") v.innerHTML = quotesView();
  else if(r.name === "settings") v.innerHTML = settingsView();
  else if(r.name === "search"){
    v.innerHTML = searchView();
    const inp = $("#search-input");
    if(!searchQuery){ inp.focus(); }
  }
  else {
    if(["reading", "done", "rec"].includes(r.arg)) lastTab = r.arg;
    v.innerHTML = shelfView();
  }
  if(animate){ v.classList.remove("view-in"); void v.offsetWidth; v.classList.add("view-in"); }
  const cur = r.name === "quotes" ? "nav-quotes" : (r.name === "shelf" || r.name === "book") ? "nav-shelf" : "";
  ["nav-shelf", "nav-quotes"].forEach(id => {
    const el = $("#" + id);
    if(id === cur) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
  });
}
window.addEventListener("hashchange", () => { summaryOpen = false; render(true); window.scrollTo(0, 0); });

// ───────────────────────── 내 서재 ─────────────────────────
function shelfView(){
  const now = new Date();
  const year = now.getFullYear();
  const reading = books.filter(b => b.status === "reading");
  const doneThisYear = books.filter(b => b.status === "done" && b.finishedAt && new Date(b.finishedAt).getFullYear() === year).length;
  const quoteCount = books.reduce((n, b) => n + b.quotes.length, 0);
  const tabs = [
    ["reading", "읽는 중", b => b.status === "reading"],
    ["done", "읽음", b => b.status === "done"],
    ["rec", "추천", b => b.rec],
  ];

  let body = "";
  if(lastTab === "done") body = doneShelf();
  else {
    const list = books.filter(tabs.find(t => t[0] === lastTab)[2]).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
    body = list.length ? `<div class="list">${list.map(bookCard).join("")}</div>` : emptyState(lastTab);
  }

  return `<header class="masthead">
    <div class="top"><span class="eyebrow">${now.getMonth()+1}월 ${now.getDate()}일 ${WEEKDAYS[now.getDay()]}요일</span>
      <span style="display:flex">${books.length ? `<button class="iconbtn" type="button" data-go="#/search" aria-label="찾기">${ICON_SEARCH}</button>` : ""}
      <button class="iconbtn" type="button" data-go="#/settings" aria-label="설정과 백업">${ICON_GEAR}</button></span></div>
    <h1>내 서재</h1>
    ${books.length ? `<div class="stats">
      <div class="stat"><b class="mono">${reading.length}</b><span>읽는 중</span></div>
      <div class="stat"><b class="mono">${doneThisYear}</b><span>${year}년에 다 읽음</span></div>
      <div class="stat"><b class="mono">${quoteCount}</b><span>밑줄 친 문장</span></div></div>` : ""}
  </header>
  ${todayCard()}
  <div class="tabs" role="tablist">${tabs.map(([k, l, f]) =>
    `<button class="tab" role="tab" type="button" data-go="#/shelf/${k}" aria-selected="${k === lastTab}">${l}<span class="n">${books.filter(f).length}</span></button>`).join("")}</div>
  ${body}`;
}

// 오늘의 밑줄: 예전에 그은 밑줄 하나를 다시 보여 준다.
// 같은 날에는 같은 문장이 나오고(날짜로 고름), '다른 문장'을 누르면 다음 것으로 넘어간다.
let quoteShift = 0;
function todayCard(){
  const all = books.flatMap(b => b.quotes.map(q => ({...q, b})))
    .sort((x, y) => (x.createdAt || "").localeCompare(y.createdAt || "") || x.id.localeCompare(y.id));
  if(!all.length) return "";
  const d = new Date();
  const q = all[(titleHash(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`) + quoteShift) % all.length];
  return `<div class="today" style="--c:${coverColor(q.b.title)}">
    <div class="head-row"><span class="eyebrow">오늘의 밑줄</span>
      ${all.length > 1 ? `<button class="shuffle" type="button" data-shuffle>${ICON_SHUFFLE}다른 문장</button>` : ""}</div>
    <button class="open" type="button" data-open="${esc(q.b.id)}"><p><span class="ul">${esc(q.text)}</span></p>
      <span class="src">『${esc(q.b.title)}』 ${esc(q.b.author)}${q.page ? ` · p.${esc(q.page)}` : ""}${q.createdAt ? ` · ${fmtDate(q.createdAt)}에 그음` : ""}</span></button>
  </div>`;
}

// ───────────────────────── 찾기 ─────────────────────────
let searchQuery = "";
function searchView(){
  return `<div class="topbar"><button class="back" type="button" data-back aria-label="뒤로">${ICON_BACK}</button>
    <label class="searchbar">${ICON_SEARCH}<input id="search-input" type="search" placeholder="제목, 지은이, 밑줄, 느낌에서 찾기" value="${esc(searchQuery)}" autocomplete="off" enterkeyhint="search"></label></div>
  <div id="results">${searchResults()}</div>`;
}

// 찾은 단어에 표시를 한다 (먼저 안전하게 바꾼 뒤 표시)
function highlight(text, q){
  const s = String(text), low = s.toLowerCase(), ql = q.toLowerCase();
  let out = "", i = 0, j;
  while((j = low.indexOf(ql, i)) !== -1){ out += esc(s.slice(i, j)) + `<mark>${esc(s.slice(j, j + q.length))}</mark>`; i = j + q.length; }
  return out + esc(s.slice(i));
}
// 긴 글에서 찾은 단어 주변만 잘라 보여 준다
function around(text, q){
  const s = String(text).replace(/\s+/g, " "), j = s.toLowerCase().indexOf(q.toLowerCase());
  const from = Math.max(0, j - 30), to = Math.min(s.length, j + q.length + 50);
  return (from > 0 ? "…" : "") + highlight(s.slice(from, to), q) + (to < s.length ? "…" : "");
}

function searchResults(){
  const q = searchQuery.trim();
  if(!q) return `<p class="hint">책 제목이나 지은이, 밑줄 친 문장,<br>내가 쓴 느낌 속 단어로 찾아요.</p>`;
  const has = v => String(v || "").toLowerCase().includes(q.toLowerCase());
  const bookHits = books.filter(b => has(b.title) || has(b.author) || has(b.publisher));
  const quoteHits = books.flatMap(b => b.quotes.filter(x => has(x.text)).map(x => ({...x, b})));
  const feelHits = books.filter(b => has(b.feeling) || has(b.summary));
  if(!bookHits.length && !quoteHits.length && !feelHits.length)
    return `<p class="hint">‘${esc(q)}’이(가) 들어간 기록이 없어요.</p>`;
  let html = "";
  if(quoteHits.length) html += `<div class="result-head">밑줄<span>${quoteHits.length}</span></div><div class="list">${quoteHits.map(x =>
    `<button class="quote" type="button" data-open="${esc(x.b.id)}"><p>${highlight(x.text, q)}</p>
     <div class="src"><span class="book" style="--c:${coverColor(x.b.title)}"><i></i><span>『${esc(x.b.title)}』 ${esc(x.b.author)}</span></span>
     <span class="mono">${x.page ? "p." + esc(x.page) : ""}</span></div></button>`).join("")}</div>`;
  if(bookHits.length) html += `<div class="result-head">책<span>${bookHits.length}</span></div><div class="list">${bookHits.map(bookCard).join("")}</div>`;
  if(feelHits.length) html += `<div class="result-head">느낌·줄거리<span>${feelHits.length}</span></div><div class="list">${feelHits.map(b =>
    `<button class="feel-hit" type="button" data-open="${esc(b.id)}"><strong>『${esc(b.title)}』</strong><p>${around(has(b.feeling) ? b.feeling : b.summary, q)}</p></button>`).join("")}</div>`;
  return html;
}

// 읽는 중·추천 탭의 책 카드
function bookCard(b){
  const lastQuote = b.quotes[b.quotes.length - 1];
  const snip = lastTab === "rec" && b.feeling ? b.feeling : lastQuote ? `“${lastQuote.text}”` : "";
  const state = b.status === "done"
    ? `<span>${fmtDate(b.finishedAt)} 다 읽음</span>`
    : b.startedAt ? `<span>${fmtMonthDay(b.startedAt)}부터 읽는 중</span>` : "<span>읽는 중</span>";
  return `<button class="card" type="button" data-open="${esc(b.id)}">${ribbonMark(b)}${cover(b, "md")}
    <div class="info"><span class="kind">${esc(b.genre)}</span><h3>${esc(b.title)}</h3>
    <span class="by">${esc([b.author, b.publisher].filter(Boolean).join(" · "))}</span>
    ${snip ? `<div class="snip">${esc(snip)}</div>` : ""}
    <div class="meta">${state}${b.quotes.length ? `<span>· 밑줄 ${b.quotes.length}</span>` : ""}</div></div></button>`;
}

// 읽음 탭: 연도별 나무 책장
function doneShelf(){
  const done = books.filter(b => b.status === "done").sort((a, b) => (b.finishedAt || "").localeCompare(a.finishedAt || ""));
  if(!done.length) return emptyState("done");
  const byYear = new Map();
  for(const b of done){
    const y = b.finishedAt ? new Date(b.finishedAt).getFullYear() : "언젠가";
    if(!byYear.has(y)) byYear.set(y, []);
    byYear.get(y).push(b);
  }
  let html = "";
  for(const [y, list] of byYear){
    let rows = "";
    for(let i = 0; i < list.length; i += 3){
      rows += `<div class="shelf-row">${list.slice(i, i + 3).map(b =>
        `<button class="spot" type="button" data-open="${esc(b.id)}" aria-label="${esc(b.title)}">${ribbonMark(b)}${cover(b, "fill")}</button>`).join("")}</div>`;
    }
    html += `<div class="year"><h2>${y}${typeof y === "number" ? "년" : ""}</h2><span>${list.length}권</span></div><div class="shelf">${rows}</div>`;
  }
  return html;
}

function emptyState(tab){
  const msg = {
    reading: books.length ? "지금 읽는 책이 없어요.<br>새 책을 펼쳐 볼까요?" : "아직 서재가 비어 있어요.<br>첫 책을 꽂아 볼까요?",
    done: "다 읽은 책이 여기 책장에 꽂혀요.",
    rec: "책 화면에서 ‘추천하고 싶어요’를 누르면<br>여기에 모여요.",
  }[tab];
  const btn = tab === "reading" ? `<button class="btn" type="button" data-go="#/add">책 등록하기</button>` : "";
  return `<div class="empty">${EMPTY_ART}<p>${msg}</p>${btn}</div>`;
}

      <div class="r"><input id="qpage" class="field mono" type="number" min="1" placeholder="쪽" inputmode="numeric"><button class="btn" type="submit" style="flex:1">밑줄 긋기</button></div>
    </form>
  </section>

  <p style="text-align:center"><button class="linkbtn danger" type="button" data-delbook>이 책 지우기</button></p>`;

// ───────────────────────── 책 등록 / 수정 ─────────────────────────
function formView(b){
  const isNew = !b;
  b = b || {title: "", author: "", publisher: "", genre: "소설", summary: "", authorBio: "", status: "reading", rec: false};
  return `<div class="topbar"><button class="back" type="button" data-back aria-label="뒤로">${ICON_BACK}</button><h1>${isNew ? "책 등록" : "책 정보 수정"}</h1></div>
  ${isNew ? `<div class="ways">
    <div class="way">바코드<small>곧 나와요</small></div>
    <div class="way">표지 사진<small>곧 나와요</small></div>
    <div class="way on">직접 입력<small>지금 쓰는 중</small></div></div>` : ""}
  <form class="form" data-bookform>
    <div class="group">
      <label>책 제목<input id="f-title" class="field" value="${esc(b.title)}" required autocomplete="off"></label>
      <label>지은이<input id="f-author" class="field" value="${esc(b.author)}" autocomplete="off"></label>
      <label>출판사<input id="f-publisher" class="field" value="${esc(b.publisher)}" autocomplete="off"></label>
      <label>종류<select id="f-genre" class="field">${GENRES.map(g => `<option${g === b.genre ? " selected" : ""}>${g}</option>`).join("")}</select></label>
    </div>
    ${isNew ? `<div class="group">
      <div class="seg" role="group" aria-label="읽기 상태">
        <button type="button" data-fstatus="reading" aria-pressed="true">읽는 중</button>
        <button type="button" data-fstatus="done" aria-pressed="false">다 읽음</button></div>
      <label class="check"><input id="f-rec" type="checkbox"> 추천 목록에도 넣기</label></div>` : ""}
    <div class="group">
      <label>줄거리 <span class="opt">안 써도 돼요</span><textarea id="f-summary" rows="4">${esc(b.summary)}</textarea></label>
      <label>작가 소개 <span class="opt">안 써도 돼요</span><textarea id="f-bio" rows="3">${esc(b.authorBio)}</textarea></label>
    </div>
    <button class="btn wide" type="submit">${isNew ? "서재에 꽂기" : "저장하기"}</button>
  </form>`;
}

// ───────────────────────── 밑줄 친 문장 모음 ─────────────────────────
function quotesView(){
  const all = books.flatMap(b => b.quotes.map(q => ({...q, b}))).sort((x, y) => (y.createdAt || "").localeCompare(x.createdAt || ""));
  return `<header class="masthead"><div class="top"><span class="eyebrow">읽다가 멈춘 자리</span>
    ${all.length ? `<button class="iconbtn" type="button" data-go="#/search" aria-label="찾기">${ICON_SEARCH}</button>` : ""}</div><h1>밑줄 친 문장</h1>
    ${all.length ? `<div class="stats"><div class="stat"><b class="mono">${all.length}</b><span>문장</span></div>
      <div class="stat"><b class="mono">${new Set(all.map(q => q.b.id)).size}</b><span>권에서</span></div></div>` : ""}</header>
  <div class="list">${all.map(q => `<button class="quote" type="button" data-open="${esc(q.b.id)}"><p>${esc(q.text)}</p>
    <div class="src"><span class="book" style="--c:${coverColor(q.b.title)}"><i></i><span>『${esc(q.b.title)}』 ${esc(q.b.author)}</span></span>
    <span class="mono">${q.page ? "p." + esc(q.page) : ""}</span></div></button>`).join("")
    || `<div class="empty">${EMPTY_ART}<p>책 화면에서 밑줄 그은 문장이<br>여기에 모여요.</p></div>`}</div>`;
}

// ───────────────────────── 설정과 백업 ─────────────────────────
function settingsView(){
  const qCount = books.reduce((n, b) => n + b.quotes.length, 0);
  return `<div class="topbar"><button class="back" type="button" data-back aria-label="뒤로">${ICON_BACK}</button><h1>설정과 백업</h1></div>
  <div class="list">
    <div class="panel"><strong>기록은 이 폰 안에만 저장돼요</strong>
      <p>로그인이 없고, 기록을 서버로 보내지 않아요. 대신 앱을 지우거나 폰을 바꾸면 기록이 사라지니, 가끔 백업 파일을 만들어 두세요.</p>
      <p class="mono">책 ${books.length}권 · 밑줄 ${qCount}개</p></div>
    <div class="panel"><strong>백업 파일 만들기</strong>
      <p>지금까지의 기록을 파일 하나로 저장해요. 카톡 나에게 보내기나 드라이브에 올려 두면 안전해요.</p>
      <button class="btn" type="button" data-export>백업 파일 저장</button></div>
    <div class="panel"><strong>백업 파일 불러오기</strong>
      <p>새 폰에서 백업 파일을 고르면 기록이 돌아와요. 이미 있는 책은 더 최근에 고친 쪽으로 맞춰요.</p>
      <button class="btn ghost" type="button" data-import>백업 파일 고르기</button></div>
  </div>`;
}

function exportBackup(){
  const data = {app: "BOOKTRACK", version: 1, exportedAt: nowIso(), books};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `booktrack-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("백업 파일을 저장했어요");
}

// 옛 기록이나 다른 버전 파일도 안전하게 읽도록 모양을 맞춘다
function normalizeBook(x){
  if(!x || typeof x !== "object" || !x.id || !x.title) return null;
  return {
    id: String(x.id), title: String(x.title), author: String(x.author || ""), publisher: String(x.publisher || ""),
    isbn: String(x.isbn || ""), genre: GENRES.includes(x.genre) ? x.genre : "기타",
    status: x.status === "done" ? "done" : "reading", rec: !!x.rec,
    startedAt: x.startedAt || "", finishedAt: x.finishedAt || "",
    summary: String(x.summary || ""), authorBio: String(x.authorBio || ""), feeling: String(x.feeling || ""),
    quotes: Array.isArray(x.quotes) ? x.quotes.filter(q => q && q.text).map(q => ({id: String(q.id || newId()), text: String(q.text), page: q.page ? String(q.page) : "", createdAt: q.createdAt || ""})) : [],
    createdAt: x.createdAt || nowIso(), updatedAt: x.updatedAt || "",
  };
}

async function importBackup(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast("백업 파일을 읽지 못했어요"); }
  if(!data || data.app !== "BOOKTRACK" || !Array.isArray(data.books)) return toast("북트랙 백업 파일이 아니에요");
  let added = 0, updated = 0;
  for(const raw of data.books){
    const b = normalizeBook(raw); if(!b) continue;
    const cur = findBook(b.id);
    if(!cur){ books.push(b); added++; await dbPut(b); }
    else if((b.updatedAt || "") > (cur.updatedAt || "")){ Object.assign(cur, b); updated++; await dbPut(cur); }
  }
  render();
  toast(`새 책 ${added}권, 고친 책 ${updated}권을 불러왔어요`);
}

// ───────────────────────── 버튼 처리 ─────────────────────────
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t || t.closest("#modal")) return;
  const r = parseRoute();
  const cur = r.name === "book" ? findBook(r.arg) : null;

  if(t.id === "nav-shelf") return go("#/shelf/" + lastTab);
  if(t.id === "nav-quotes") return go("#/quotes");
  if(t.id === "nav-add") return go("#/add");
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.open) return go("#/book/" + encodeURIComponent(t.dataset.open));
  if(t.hasAttribute("data-back")) return history.length > 1 ? history.back() : goReplace("#/shelf/" + lastTab);

  if(t.dataset.fstatus){
    t.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === t));
    return;
  }
  if(t.hasAttribute("data-shuffle")){ quoteShift++; return render(); }
  if(t.hasAttribute("data-export")) return exportBackup();
  if(t.hasAttribute("data-import")) return $("#import-file").click();
  if(!cur) return;

  if(t.dataset.status){
    if(cur.status === t.dataset.status) return;
    cur.status = t.dataset.status;
    if(cur.status === "done"){ cur.finishedAt = nowIso(); toast("다 읽은 책장에 꽂았어요"); }
    else { cur.finishedAt = ""; toast("읽는 중으로 옮겼어요"); }
    saveBook(cur); return render();
  }
  if(t.hasAttribute("data-rec")){
    cur.rec = !cur.rec; toast(cur.rec ? "추천 목록에 넣었어요" : "추천 목록에서 뺐어요");
    saveBook(cur); return render();
  }
  if(t.hasAttribute("data-more")){ summaryOpen = !summaryOpen; return render(); }
  if(t.dataset.delquote){
    const id = t.dataset.delquote;
    return ask("이 밑줄을 지울까요?", "지우기", () => {
      cur.quotes = cur.quotes.filter(q => q.id !== id); saveBook(cur); render(); toast("밑줄을 지웠어요");
    }, true);
  }
  if(t.hasAttribute("data-delbook")){
    return ask(`『${esc(cur.title)}』을(를) 지울까요?<br><small style="color:var(--ink-soft);font-family:var(--f-body);font-size:13px">느낌과 밑줄도 함께 지워지고, 되돌릴 수 없어요.</small>`, "지우기", async () => {
      books = books.filter(b => b !== cur);
      try { await dbDelete(cur.id); } catch(e){ console.error(e); }
      toast("책을 지웠어요"); goReplace("#/shelf/" + lastTab);
    }, true);
  }
});
$("#modal").addEventListener("click", e => { if(e.target.id === "modal") e.target.hidden = true; });
document.addEventListener("keydown", e => { if(e.key === "Escape") $("#modal").hidden = true; });

// 느낌은 쓰는 동안 자동 저장
document.addEventListener("input", e => {
  // 찾기: 글자를 칠 때마다 결과만 다시 그림 (입력 칸은 그대로 둠)
  if(e.target.id === "search-input"){ searchQuery = e.target.value; $("#results").innerHTML = searchResults(); return; }
  if(!e.target.hasAttribute("data-feel")) return;
  const r = parseRoute(), cur = findBook(r.arg); if(!cur) return;
  cur.feeling = e.target.value;
  $("#feel-state").textContent = "쓰는 중…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => { await saveBook(cur); const s = $("#feel-state"); if(s) s.textContent = "저장됨"; }, 600);
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, r = parseRoute();

  if(f.hasAttribute("data-qform")){
    const cur = findBook(r.arg); if(!cur) return;
    const text = $("#qtext").value.trim(); if(!text) return;
    cur.quotes.push({id: newId(), text, page: $("#qpage").value.trim(), createdAt: nowIso()});
    await saveBook(cur); render(); toast("밑줄을 그었어요");
  }

  if(f.hasAttribute("data-bookform")){
    const title = $("#f-title").value.trim();
    if(!title){ $("#f-title").focus(); return; }
    const fields = {
      title, author: $("#f-author").value.trim(), publisher: $("#f-publisher").value.trim(),
      genre: $("#f-genre").value, summary: $("#f-summary").value.trim(), authorBio: $("#f-bio").value.trim(),
    };
    if(r.name === "edit"){
      const cur = findBook(r.arg); if(!cur) return;
      Object.assign(cur, fields); await saveBook(cur);
      toast("저장했어요"); history.back();
    } else {
      const done = f.querySelector('[data-fstatus="done"]').getAttribute("aria-pressed") === "true";
      const b = normalizeBook({...fields, id: newId(), status: done ? "done" : "reading", rec: $("#f-rec").checked,
        startedAt: nowIso(), finishedAt: done ? nowIso() : "", quotes: [], createdAt: nowIso()});
      books.push(b); await saveBook(b);
      lastTab = done ? "done" : "reading";
      toast("서재에 꽂았어요"); goReplace("#/book/" + encodeURIComponent(b.id));
    }
  }
});

$("#import-file").addEventListener("change", e => {
  const file = e.target.files[0]; e.target.value = "";
  if(file) importBackup(file);
});

// ───────────────────────── 시작 ─────────────────────────
(async () => {
  try { books = (await dbAll()).map(normalizeBook).filter(Boolean); }
  catch(e){ console.error(e); toast("기록을 불러오지 못했어요"); }
  // 브라우저가 저장 공간을 마음대로 비우지 않게 요청
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render(true);
})();

if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
