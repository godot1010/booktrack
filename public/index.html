<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Book Track</title>
<meta name="description" content="읽는 책, 읽고 싶은 책, 다 읽은 책과 밑줄 친 문장을 모아 두는 독서 기록장">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 색: 흰 바탕 + 코랄 포인트. 글꼴: 프리텐다드. 어두운 모드는 같은 구조로 색만 바꾼다 */
:root{
  --bg:#ffffff; --card:#ffffff; --soft:#f6f7f9; --line:#eef0f3; --line-2:#e3e6ea;
  --text:#191f28; --text-2:#4e5968; --text-3:#8b95a1;
  --coral:#f76e5a; --coral-press:#e85c47; --coral-soft:#fff0ec; --coral-ink:#c2412d;
  --green:#2f9e6e; --green-soft:#e8f7ef; --blue:#3182f6; --blue-soft:#eaf3ff;
  --shadow:0 2px 12px rgba(25,31,40,.06); --scrim:rgba(17,20,26,.45);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#16161b; --card:#202027; --soft:#24242c; --line:#2c2c35; --line-2:#383842;
  --text:#f2f4f6; --text-2:#b0b8c1; --text-3:#7d8590;
  --coral:#ff7b67; --coral-press:#ff8f7d; --coral-soft:#3a2622; --coral-ink:#ffa594;
  --green:#4cc28c; --green-soft:#1d3329; --blue:#5b9cff; --blue-soft:#1d2a3d;
  --shadow:0 2px 12px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6); color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-0.01em;
  padding:env(safe-area-inset-top,0px) 20px 0;-webkit-tap-highlight-color:transparent;word-break:keep-all}
.app{max-width:480px;margin:0 auto;padding-block:4px 120px}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .view-in{animation:rise .22s ease-out}
  @keyframes rise{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}
}

/* ── 머리: 로고 */
.head{display:flex;align-items:center;gap:8px;padding-block:14px 8px}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--coral);display:flex;align-items:center;justify-content:center;color:#fff}
.brand .word{font-size:20px;font-weight:800;letter-spacing:-0.03em}
.brand .word b{color:var(--coral);font-weight:800}
.head .sp{flex:1}
.icon-btn{border:0;background:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.icon-btn:active{background:var(--soft)}
.page-title{display:flex;align-items:center;gap:8px;padding-block:16px 12px}
.page-title h1{font-size:24px;font-weight:800;letter-spacing:-0.03em;flex:1}
.topbar{display:flex;align-items:center;gap:4px;padding-block:8px}
.topbar h1{font-size:18px;font-weight:700;flex:1}
.back{border:0;background:none;width:40px;height:40px;margin-left:-10px;display:flex;align-items:center;justify-content:center;color:var(--text)}

/* ── 홈 구역 */
.date{font-size:13px;color:var(--text-3);margin:2px 0 14px}
.section{margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-head h2{font-size:18px;font-weight:700;letter-spacing:-0.02em}
.sec-head h2 span{color:var(--coral);margin-left:4px}
.more{border:0;background:none;font-size:13px;color:var(--text-3);padding:4px 0}

/* 오늘의 밑줄 */
.today{background:var(--coral-soft);border-radius:20px;padding:18px 18px 14px}
.today .row{display:flex;justify-content:space-between;align-items:center}
.today .tag{font-size:13px;font-weight:700;color:var(--coral-ink)}
.shuffle{border:0;background:none;font-size:12px;color:var(--coral-ink);display:flex;align-items:center;gap:4px;padding:4px 0;opacity:.85}
.today .open{display:block;width:100%;border:0;background:none;padding:0;text-align:left;margin-top:10px}
.today .open p{font-size:18px;line-height:1.65;font-weight:600;letter-spacing:-0.02em;overflow-wrap:anywhere}
.today .src{display:block;margin-top:10px;font-size:13px;color:var(--text-2)}

/* 지금 읽는 책 (옆으로 넘김) */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding:2px 20px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.now{flex:0 0 86%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:14px;box-shadow:var(--shadow)}
.now:only-child{flex-basis:100%}
.now .info{min-width:0;flex:1;display:flex;flex-direction:column}
.now .open{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.now h3{font-size:17px;font-weight:700;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.now .meta{font-size:12.5px;color:var(--text-3);margin-top:4px}
.now .actions{margin-top:auto;padding-top:10px}

/* 읽고 싶은 책 (표지 줄) */
.covers{display:flex;gap:12px;overflow-x:auto;margin-inline:-20px;padding:2px 20px 6px;scrollbar-width:none}
.covers::-webkit-scrollbar{display:none}
.covers .spot{flex:0 0 84px}

/* 올해 기록 */
.year-strip{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--soft);border-radius:16px;padding:14px 16px}
.year-strip .big{font-size:22px;font-weight:800;color:var(--coral)}
.year-strip .t{flex:1;font-size:14px;color:var(--text-2)}

/* ── 표지 (사진이 없으면 색으로 그린 표지) */
.cover{position:relative;flex:none;aspect-ratio:2/3;background:var(--c);color:#fff;border-radius:6px;overflow:hidden;
  display:flex;flex-direction:column;padding:var(--pad);box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 14px -6px rgba(25,31,40,.35)}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6%;background:rgba(0,0,0,.12)}
.cover .ct{font-weight:700;font-size:var(--ts);line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cover .ca{margin-top:auto;font-size:var(--as);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.has-img .ct,.cover.has-img .ca{visibility:hidden}
.cover.sm{width:44px;--ts:7px;--pad:6px 5px 5px 7px}.cover.sm .ca{display:none}
.cover.md{width:72px;--ts:10px;--as:8px;--pad:9px 7px 7px 10px}
.cover.fill{width:100%;--ts:12px;--as:9px;--pad:12% 9% 9% 12%}
.cover.lg{width:140px;--ts:17px;--as:11px;--pad:18px 14px 14px 18px;margin-inline:auto;box-shadow:0 2px 4px rgba(0,0,0,.08),0 18px 32px -14px rgba(25,31,40,.45)}

/* ── 서재: 칩 + 표지 격자 */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 18px;padding:2px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--text-2);font-weight:500}
.chip .n{margin-left:5px;color:var(--text-3);font-weight:500}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:700}
.chip[aria-pressed="true"] .n{color:var(--bg);opacity:.7}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 14px}
.spot{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:7px;text-align:left;min-width:0;position:relative}
.spot .t{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spot .s{font-size:11.5px;color:var(--text-3);margin-top:-4px}
.spot:active .cover{transform:scale(.97)}
.ribbon{position:absolute;top:-2px;right:8px;width:12px;height:22px;background:var(--coral);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);z-index:1}

/* 상태 표시 */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px}
.pill.reading{background:var(--coral-soft);color:var(--coral-ink)}
.pill.want{background:var(--blue-soft);color:var(--blue)}
.pill.done{background:var(--green-soft);color:var(--green)}

/* ── 빈 화면 */
.empty{text-align:center;color:var(--text-2);padding:40px 12px 24px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{font-size:15px;line-height:1.7}
.empty-card{border:1.5px dashed var(--line-2);border-radius:20px;padding:22px 18px;text-align:center;color:var(--text-2);display:flex;flex-direction:column;gap:12px;align-items:center;font-size:14.5px}
.welcome{text-align:center;padding:40px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:14px}
.welcome h2{font-size:22px;font-weight:800;letter-spacing:-0.03em;line-height:1.4}
.welcome p{color:var(--text-2);font-size:15px;line-height:1.7}

/* ── 단추 */
.btn{border:0;border-radius:14px;padding:13px 18px;background:var(--coral);color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:var(--coral-press)}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.line{background:none;border:1px solid var(--line-2);color:var(--text)}
.btn.danger{background:#e5484d}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.soft{background:var(--coral-soft);color:var(--coral-ink)}
.linkbtn{border:0;background:none;color:var(--coral-ink);font-weight:600;padding:4px}
.linkbtn.muted{color:var(--text-3);font-weight:500}

/* ── 책 화면 */
.hero{margin-inline:-20px;padding:0 20px 24px;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,var(--bg)),var(--bg))}
.hero .topbar{text-align:left}
.hero .kind{font-size:13px;color:var(--text-3);margin-top:18px;display:block}
.hero h2{font-size:23px;font-weight:800;letter-spacing:-0.03em;line-height:1.35;margin-top:4px;overflow-wrap:anywhere}
.hero .by{display:block;margin-top:4px;font-size:14px;color:var(--text-2)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:10px 4px;font-size:14px;color:var(--text-3);border-radius:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.controls{display:flex;flex-direction:column;gap:10px}
.recbtn{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:none;border-radius:14px;padding:11px;font-size:14px;color:var(--text-2);font-weight:600}
.recbtn[aria-pressed="true"]{border-color:var(--coral);color:var(--coral-ink);background:var(--coral-soft)}
.mini{width:9px;height:14px;background:currentColor;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.dates{font-size:12.5px;color:var(--text-3);text-align:center;margin-top:12px}
.block{margin-top:30px}
.block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.block-head h3{font-size:17px;font-weight:700}
.block-head h3 span{color:var(--coral);margin-left:4px}
.block-head .side{font-size:12.5px;color:var(--text-3)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.summary{font-size:15px;line-height:1.75;color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
.author{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:16px;padding:14px}
.author .t{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:14px;white-space:pre-wrap;color:var(--text-2);line-height:1.65}
.author strong{color:var(--text);font-size:15px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--coral-soft);color:var(--coral-ink);display:flex;align-items:center;justify-content:center;font-weight:800}
.wiki{font-size:12.5px;color:var(--text-3);text-decoration:none;margin-top:2px}
.hint{color:var(--text-3);font-size:14px;line-height:1.7}

textarea,.field{width:100%;background:var(--soft);border:1px solid transparent;border-radius:14px;padding:12px 14px;resize:vertical;font-size:16px;outline:none}
textarea:focus,.field:focus{border-color:var(--coral);background:var(--card)}
textarea.feel{min-height:130px;line-height:1.7}

/* ── 밑줄 카드 */
.list{display:flex;flex-direction:column;gap:12px}
.quote{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.quote p{font-size:16px;line-height:1.7;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.ul{background-image:linear-gradient(transparent 62%,color-mix(in srgb,var(--coral) 28%,transparent) 62% 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.quote .src{font-size:12.5px;color:var(--text-3);display:flex;justify-content:space-between;align-items:center;gap:8px}
.quote .book{display:flex;align-items:center;gap:6px;min-width:0}
.quote .book i{flex:none;width:8px;height:12px;border-radius:2px;background:var(--c)}
.quote .book span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote .del{border:0;background:none;color:var(--text-3);font-size:12.5px;padding:2px 0}
mark{background:var(--coral-soft);color:var(--coral-ink);border-radius:3px;padding:0 1px}

/* ── 등록 / 수정 */
.form{display:flex;flex-direction:column;gap:16px}
.form label{font-size:13px;font-weight:600;color:var(--text-2);display:flex;flex-direction:column;gap:6px}
.form .opt{font-weight:400;color:var(--text-3)}
.check{flex-direction:row!important;align-items:center;gap:8px!important;font-size:15px!important;color:var(--text)!important;font-weight:500!important}
.check input{width:20px;height:20px;accent-color:var(--coral)}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.way{border:1px solid var(--line-2);border-radius:14px;padding:12px 6px;text-align:center;font-size:14px;font-weight:700;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:2px;background:none}
.way small{font-size:12px;font-weight:400;color:var(--text-3)}
.way.on{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-ink)}
.scanner{position:relative;border-radius:20px;overflow:hidden;background:#111;aspect-ratio:4/3;max-width:100%;margin-bottom:12px}
.scanner video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:2px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan-frame::after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:var(--coral);box-shadow:0 0 8px var(--coral)}
@media (prefers-reduced-motion:no-preference){.scan-frame::after{animation:scanline 1.1s ease-in-out infinite alternate}
  @keyframes scanline{from{top:12%}to{top:88%}}}
.scan-msg{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:0 12px}
.scan-off{display:flex;align-items:center;justify-content:center;text-align:center;color:#ccc;font-size:14px;padding:20px;height:100%;line-height:1.7}
.isbn-row{display:flex;gap:8px}
.isbn-row input{flex:1;min-width:0}
.found{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;margin-top:14px;box-shadow:var(--shadow)}
.found .top{display:flex;gap:14px}
.found .top .t{min-width:0;display:flex;flex-direction:column;gap:3px}
.found h3{font-size:18px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.found .by{font-size:13.5px;color:var(--text-2)}
.found .sum{font-size:14px;line-height:1.7;color:var(--text-2)}
.found .ok{font-size:12.5px;font-weight:700;color:var(--coral-ink)}
.found .sub{font-size:12.5px;color:var(--text-3)}
.genre-pick{display:flex;flex-wrap:wrap;gap:6px}
.genre-pick button{border:1px solid var(--line-2);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text-2)}
.genre-pick button[aria-pressed="true"]{border-color:var(--text);background:var(--text);color:var(--bg);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── 찾기 */
.searchbar{display:flex;align-items:center;gap:8px;flex:1;background:var(--soft);border-radius:14px;padding:0 14px;color:var(--text-3)}
.searchbar input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:16px;outline:none;color:var(--text)}
.result-head{font-size:15px;font-weight:700;margin:24px 0 10px}
.result-head span{color:var(--coral);margin-left:4px}
.feel-hit{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.feel-hit p{margin-top:4px;font-size:14px;line-height:1.7;color:var(--text-2)}
.row-card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.row-card .t{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.row-card h3{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-card .by{font-size:12.5px;color:var(--text-3)}

/* ── 나 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:13px;color:var(--text-2)}
.stat b{font-size:26px;font-weight:800;letter-spacing:-0.02em}
.stat.main{grid-column:1/-1;background:var(--coral-soft)}
.stat.main b{color:var(--coral-ink)}
.months{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:6px}
.months div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.months i{display:block;width:100%;max-width:18px;border-radius:5px 5px 2px 2px;background:var(--coral);min-height:3px}
.months i.zero{background:var(--line-2)}
.months small{font-size:10.5px;color:var(--text-3)}
.panel{background:var(--soft);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.panel strong{font-size:16px}
.panel p{font-size:14px;color:var(--text-2);line-height:1.65}

/* ── 아래 메뉴 */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bottom .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.bottom button{border:0;background:none;padding:6px 0;font-size:11px;font-weight:600;color:var(--text-3);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom button[aria-current="page"]{color:var(--text)}
nav.bottom .add{justify-self:center;background:var(--coral);color:#fff;width:52px;height:52px;border-radius:18px;justify-content:center;padding:0;box-shadow:0 6px 16px -6px var(--coral)}
nav.bottom .add:active{background:var(--coral-press)}

/* ── 창, 알림 */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));max-width:480px;width:100%;display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow-y:auto}
.sheet h2{font-size:19px;font-weight:800;letter-spacing:-0.02em}
.sheet .msg{font-size:16px;line-height:1.6}
.sheet .msg small{display:block;color:var(--text-3);font-size:13.5px;margin-top:4px}
.ocr{display:flex;flex-direction:column;gap:10px}
.crop{position:relative;width:fit-content;max-width:100%;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:12px;overflow:hidden;line-height:0}
.crop img{max-width:100%;max-height:52vh;width:auto;height:auto;display:block;pointer-events:none}
.crop .sel{position:absolute;border:2px solid var(--coral);background:color-mix(in srgb,var(--coral) 18%,transparent);border-radius:4px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.qpage-row{display:flex;gap:8px}
.qpage-row input{width:96px}
.share-card{background:var(--soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.share-card .top{display:flex;gap:14px;align-items:flex-start}
.share-card .top .t{min-width:0;display:flex;flex-direction:column;gap:3px}
.share-card h3{font-size:17px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.share-card .by{font-size:13px;color:var(--text-2)}
.share-card .rec{font-size:12.5px;color:var(--coral-ink);font-weight:700}
.share-card .feel{font-size:14.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.share-card .q{font-size:15px;line-height:1.75;font-weight:500}
.share-opts{display:flex;flex-direction:column;gap:10px}
.share-opts .opt-title{font-size:13px;font-weight:600;color:var(--text-2)}
.share-opts label{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.5}
.share-opts input{margin-top:3px;accent-color:var(--coral);flex:none;width:18px;height:18px}
.share-opts .qtext{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 40px);text-align:center}
</style>
</head>
<body>
<div class="app"><main id="view"></main></div>

<nav class="bottom" aria-label="메뉴">
  <div class="in">
    <button id="nav-home" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button id="nav-shelf" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="4.5" height="16" rx="1"/><rect x="10" y="4" width="4.5" height="16" rx="1"/><path d="m16.5 5.2 3.6 14.3"/></svg>서재</button>
    <button id="nav-add" class="add" type="button" aria-label="책 등록"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="nav-quotes" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v7a5 5 0 0 0 10 0V4"/><path d="M4 20h16"/></svg>밑줄</button>
    <button id="nav-me" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>나</button>
  </div>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<div id="modal" class="modal" hidden></div>
<input id="import-file" type="file" accept=".json,application/json" hidden>

<script>
// ───────────────────────── 저장소 (폰 안의 IndexedDB) ─────────────────────────
// 기록은 폰 안에만 저장한다. 서버로 보내지 않는다.
const DB_NAME = "booktrack", STORE = "books";
let dbPromise = null;
function openDB(){
  if(!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, {keyPath: "id"});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function dbAll(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction(STORE).objectStore(STORE).getAll();
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function dbPut(book){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(book);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function dbDelete(id){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

// ───────────────────────── 기본 도구 ─────────────────────────
const GENRES = ["소설", "시", "수필", "인문", "자기계발", "어린이", "만화", "기타"];
const COVER_COLORS = ["#f76e5a", "#3f9d74", "#3b7be8", "#8a6ae6", "#e8963a", "#2aa5a0", "#df5f8a", "#55657d", "#b5793f", "#6a8f3a"];
const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
let books = [];
let saveTimer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const fmtDate = iso => { if(!iso) return ""; const d = new Date(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; };
const fmtMonthDay = iso => { const d = new Date(iso); return `${d.getMonth()+1}월 ${d.getDate()}일`; };
const findBook = id => books.find(b => b.id === id);
const allQuotes = () => books.flatMap(b => b.quotes.map(q => ({...q, b})));

// 제목으로 표지 색을 정한다 (같은 책은 늘 같은 색)
function titleHash(title){ let h = 0; for(const c of String(title)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
const coverColor = title => COVER_COLORS[titleHash(title) % COVER_COLORS.length];
function cover(b, size){
  // 진짜 표지 사진이 있으면 쓰고, 못 불러오면 그려 둔 표지로 돌아간다
  const img = b.cover && /^https:\/\//.test(b.cover)
    ? `<img src="${esc(b.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('has-img');this.remove()">` : "";
  return `<div class="cover ${size}${img ? " has-img" : ""}" style="--c:${coverColor(b.title)}" aria-hidden="true">
    ${img}<span class="ct">${esc(b.title)}</span><span class="ca">${esc(b.author)}</span></div>`;
}

// 읽기 상태: 읽고 싶은(want) → 읽는 중(reading) → 다 읽음(done)
const STATUSES = [["want", "읽고 싶은"], ["reading", "읽는 중"], ["done", "다 읽음"]];
const STATUS_LABEL = {want: "읽고 싶은", reading: "읽는 중", done: "다 읽음"};
const statusSeg = (attr, cur) => `<div class="seg" role="group" aria-label="읽기 상태">${STATUSES.map(([k, l]) =>
  `<button type="button" data-${attr}="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div>`;
const pickedStatus = box => box.querySelector('[data-fstatus][aria-pressed="true"]')?.dataset.fstatus || "reading";
// 새 책의 날짜: 읽고 싶은 책은 아직 시작 전
const newDates = st => ({startedAt: st === "want" ? "" : nowIso(), finishedAt: st === "done" ? nowIso() : ""});
const addedToast = st => st === "want" ? "읽고 싶은 책에 담았어요" : "서재에 꽂았어요";
const ribbonMark = b => b.rec ? '<span class="ribbon" aria-label="추천"></span>' : "";

// 아이콘
const svg = (d, size = 22, w = 1.9) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON_BACK = svg('<path d="M15 5l-7 7 7 7"/>', 24, 2);
const ICON_SEARCH = svg('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>');
const ICON_SHARE = svg('<path d="M12 4v11M8 8l4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>');
const ICON_EDIT = svg('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>');
const ICON_SHUFFLE = svg('<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>', 14, 2.2);
const ICON_CAMERA = svg('<path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/>', 18);
const ICON_PEN =svg('<path d="M12 5v14M5 12h14"/>', 16, 2.4);
// 로고: 코랄 네모 안에 책갈피
const LOGO_MARK = `<span class="mark"><svg width="16" height="18" viewBox="0 0 16 18" aria-hidden="true"><path d="M2 1.5h12v15l-6-4.2-6 4.2z" fill="#fff"/></svg></span>`;
const BRAND = `<button class="brand" type="button" data-go="#/home" aria-label="Book Track 홈">${LOGO_MARK}<span class="word">Book <b>Track</b></span></button>`;

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800);
}

// 앱 안에서 쓰는 확인창
function ask(message, okLabel, onOk, danger){
  const m = $("#modal");
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><p class="msg">${message}</p>
    <div class="two"><button class="btn ghost" type="button" id="ask-no">취소</button>
    <button class="btn${danger ? " danger" : ""}" type="button" id="ask-yes">${esc(okLabel)}</button></div></div>`;
  m.hidden = false;
  $("#ask-no").onclick = () => m.hidden = true;
  $("#ask-yes").onclick = () => { m.hidden = true; onOk(); };
  $("#ask-yes").focus();
}

async function saveBook(b){
  b.updatedAt = nowIso();
  try { await dbPut(b); }
  catch(e){ toast("저장하지 못했어요. 폰 저장 공간을 확인해 주세요."); console.error(e); }
}

// ───────────────────────── 화면 이동 (주소 # 사용 → 폰 뒤로가기 버튼이 동작) ─────────────────────────
function parseRoute(){
  const [name, arg] = location.hash.replace(/^#\/?/, "").split("/");
  return {name: name || "home", arg: arg ? decodeURIComponent(arg) : ""};
}
const go = hash => { location.hash = hash; };
const goReplace = hash => { location.replace(hash); };

const FILTERS = [
  ["all", "전체", () => true],
  ["reading", "읽는 중", b => b.status === "reading"],
  ["want", "읽고 싶은", b => b.status === "want"],
  ["done", "다 읽음", b => b.status === "done"],
  ["rec", "추천", b => b.rec],
];
let shelfFilter = "all";
let summaryOpen = false;

function render(animate){
  const r = parseRoute();
  const v = $("#view");
  if(r.name === "book"){
    const b = findBook(r.arg);
    if(!b) return goReplace("#/shelf/" + shelfFilter);
    v.innerHTML = detailView(b);
  }
  else if(r.name === "add") v.innerHTML = formView(null);
  else if(r.name === "scan"){ v.innerHTML = scanView(); if(scanState.status === "idle") startScan(); }
  else if(r.name === "edit"){
    const b = findBook(r.arg);
    if(!b) return goReplace("#/shelf/" + shelfFilter);
    v.innerHTML = formView(b);
  }
  else if(r.name === "shelf"){
    if(FILTERS.some(f => f[0] === r.arg)) shelfFilter = r.arg;
    v.innerHTML = shelfView();
  }
  else if(r.name === "quotes") v.innerHTML = quotesView();
  else if(r.name === "me" || r.name === "settings") v.innerHTML = meView();
  else if(r.name === "search"){
    v.innerHTML = searchView();
    if(!searchQuery) $("#search-input").focus();
  }
  else v.innerHTML = homeView();
  if(animate){ v.classList.remove("view-in"); void v.offsetWidth; v.classList.add("view-in"); }
  const tab = {home: "nav-home", shelf: "nav-shelf", book: "nav-shelf", quotes: "nav-quotes", me: "nav-me", settings: "nav-me"}[r.name] || (r.name === "" ? "nav-home" : "");
  ["nav-home", "nav-shelf", "nav-quotes", "nav-me"].forEach(id => {
    const el = $("#" + id);
    if(id === tab) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
  });
}
window.addEventListener("hashchange", () => {
  summaryOpen = false;
  $("#modal").hidden = true;
  // 바코드 화면을 떠나면 카메라를 끄고, 새로 들어오면 처음부터
  if(parseRoute().name !== "scan"){ stopScan(); }
  else if(scanState.status !== "loading"){ scanState = {status: "idle"}; }
  render(true); window.scrollTo(0, 0);
});
document.addEventListener("visibilitychange", () => { if(document.hidden) stopScan(); else if(parseRoute().name === "scan" && scanState.status === "idle") startScan(); });

// ───────────────────────── 홈 ─────────────────────────
// 오늘의 밑줄 → 지금 읽는 책(바로 밑줄 긋기) → 읽고 싶은 책 → 올해 기록
function homeView(){
  const now = new Date();
  const head = `<header class="head">${BRAND}<span class="sp"></span>
    ${books.length ? `<button class="icon-btn" type="button" data-go="#/search" aria-label="찾기">${ICON_SEARCH}</button>` : ""}</header>`;
  if(!books.length) return `${head}
    <div class="welcome">${bigMark()}
      <h2>읽은 책과 마음에 남은 문장을<br>한곳에 모아 보세요</h2>
      <p>책 뒷면 바코드만 찍으면<br>표지와 책 소개가 알아서 채워져요.</p>
      <button class="btn wide" type="button" data-go="#/scan">첫 책 등록하기</button>
      <button class="linkbtn muted" type="button" data-go="#/me">백업 파일이 있나요? 불러오기</button>
    </div>`;

  const reading = books.filter(b => b.status === "reading").sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
  const want = books.filter(b => b.status === "want").sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  const year = now.getFullYear();
  const doneThisYear = books.filter(b => b.status === "done" && b.finishedAt && new Date(b.finishedAt).getFullYear() === year).length;

  return `${head}
  <p class="date">${now.getMonth()+1}월 ${now.getDate()}일 ${WEEKDAYS[now.getDay()]}요일</p>
  ${todayCard()}
  <section class="section">
    <div class="sec-head"><h2>지금 읽는 책${reading.length ? `<span>${reading.length}</span>` : ""}</h2>
      ${reading.length ? `<button class="more" type="button" data-go="#/shelf/reading">모두 보기</button>` : ""}</div>
    ${reading.length ? `<div class="hscroll">${reading.map(b => `<div class="now">
        <button class="open" type="button" data-open="${esc(b.id)}" style="flex:none">${cover(b, "md")}</button>
        <div class="info"><button class="open" type="button" data-open="${esc(b.id)}"><h3>${esc(b.title)}</h3>
          <span class="meta">${esc(b.author)}${b.startedAt ? ` · ${fmtMonthDay(b.startedAt)}부터` : ""}${b.quotes.length ? ` · 밑줄 ${b.quotes.length}` : ""}</span></button>
          <div class="actions"><button class="btn sm soft" type="button" data-quickquote="${esc(b.id)}">${ICON_PEN}밑줄 긋기</button></div></div>
      </div>`).join("")}</div>`
      : `<div class="empty-card">지금 읽고 있는 책을 등록해 두면<br>여기서 바로 밑줄을 그을 수 있어요.
          <button class="btn sm" type="button" data-go="#/scan">책 등록하기</button></div>`}
  </section>
  <section class="section">
    <div class="sec-head"><h2>읽고 싶은 책${want.length ? `<span>${want.length}</span>` : ""}</h2>
      ${want.length ? `<button class="more" type="button" data-go="#/shelf/want">모두 보기</button>` : ""}</div>
    ${want.length ? `<div class="covers">${want.slice(0, 12).map(b =>
        `<button class="spot" type="button" data-open="${esc(b.id)}" aria-label="${esc(b.title)}">${cover(b, "fill")}<span class="t">${esc(b.title)}</span></button>`).join("")}</div>`
      : `<div class="empty-card">서점에서 본 책, 누가 권한 책을 담아 두세요.
          <button class="btn sm ghost" type="button" data-go="#/scan">읽고 싶은 책 담기</button></div>`}
  </section>
  <section class="section">
    <button class="year-strip" type="button" data-go="#/me"><span class="big num">${doneThisYear}권</span>
      <span class="t">${year}년에 다 읽은 책 · 밑줄 ${allQuotes().length}개</span>${svg('<path d="m9 6 6 6-6 6"/>', 18)}</button>
  </section>`;
}
const bigMark = () => `<span style="width:64px;height:64px;border-radius:20px;background:var(--coral);display:flex;align-items:center;justify-content:center">
  <svg width="30" height="34" viewBox="0 0 16 18" aria-hidden="true"><path d="M2 1.5h12v15l-6-4.2-6 4.2z" fill="#fff"/></svg></span>`;

// 오늘의 밑줄: 예전에 그은 밑줄 하나를 다시 보여 준다.
// 같은 날에는 같은 문장이 나오고(날짜로 고름), '다른 문장'을 누르면 다음 것으로 넘어간다.
let quoteShift = 0;
function todayCard(){
  const all = allQuotes().sort((x, y) => (x.createdAt || "").localeCompare(y.createdAt || "") || x.id.localeCompare(y.id));
  if(!all.length) return "";
  const d = new Date();
  const q = all[(titleHash(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`) + quoteShift) % all.length];
  return `<div class="today">
    <div class="row"><span class="tag">오늘의 밑줄</span>
      ${all.length > 1 ? `<button class="shuffle" type="button" data-shuffle>${ICON_SHUFFLE}다른 문장</button>` : ""}</div>
    <button class="open" type="button" data-open="${esc(q.b.id)}"><p><span class="ul">${esc(q.text)}</span></p>
      <span class="src">${esc(q.b.title)}${q.page ? ` · p.${esc(q.page)}` : ""}${q.createdAt ? ` · ${fmtDate(q.createdAt)}에 그음` : ""}</span></button>
  </div>`;
}

// ───────────────────────── 서재 ─────────────────────────
function shelfView(){
  const f = FILTERS.find(x => x[0] === shelfFilter);
  const list = books.filter(f[2]).sort((a, b) =>
    shelfFilter === "done" ? (b.finishedAt || "").localeCompare(a.finishedAt || "") : (b.createdAt || "").localeCompare(a.createdAt || ""));
  const empty = {
    all: "아직 서재가 비어 있어요.<br>첫 책을 등록해 보세요.",
    reading: "지금 읽는 책이 없어요.",
    want: "서점에서 본 책, 누가 권한 책을<br>여기에 담아 두세요.",
    done: "다 읽은 책이 여기에 모여요.",

function rowCard(b){

// ───────────────────────── 찾기 ─────────────────────────
let searchQuery = "";
function searchView(){
  return `<div class="topbar"><button class="back" type="button" data-back aria-label="뒤로">${ICON_BACK}</button>
    <label class="searchbar">${ICON_SEARCH}<input id="search-input" type="search" placeholder="제목, 지은이, 밑줄, 느낌에서 찾기" value="${esc(searchQuery)}" autocomplete="off" enterkeyhint="search"></label></div>
  <div id="results">${searchResults()}</div>`;
}

// 찾은 단어에 표시를 한다 (먼저 안전하게 바꾼 뒤 표시)
function highlight(text, q){
  const s = String(text), low = s.toLowerCase(), ql = q.toLowerCase();
  let out = "", i = 0, j;
  while((j = low.indexOf(ql, i)) !== -1){ out += esc(s.slice(i, j)) + `<mark>${esc(s.slice(j, j + q.length))}</mark>`; i = j + q.length; }
  return out + esc(s.slice(i));
}
// 긴 글에서 찾은 단어 주변만 잘라 보여 준다
function around(text, q){
  const s = String(text).replace(/\s+/g, " "), j = s.toLowerCase().indexOf(q.toLowerCase());
  const from = Math.max(0, j - 30), to = Math.min(s.length, j + q.length + 50);
  return (from > 0 ? "…" : "") + highlight(s.slice(from, to), q) + (to < s.length ? "…" : "");
}

function quoteCard(q, hl){
  return `<button class="quote" type="button" data-open="${esc(q.b.id)}"><p>${hl ? highlight(q.text, hl) : esc(q.text)}</p>
    <div class="src"><span class="book" style="--c:${coverColor(q.b.title)}"><i></i><span>${esc(q.b.title)} · ${esc(q.b.author)}</span></span>
    <span class="num">${q.page ? "p." + esc(q.page) : ""}</span></div></button>`;
}

function searchResults(){
  const q = searchQuery.trim();
  if(!q) return `<p class="hint" style="text-align:center;padding:40px 0">책 제목이나 지은이, 밑줄 친 문장,<br>내가 쓴 느낌 속 단어로 찾아요.</p>`;
  const has = v => String(v || "").toLowerCase().includes(q.toLowerCase());
  const bookHits = books.filter(b => has(b.title) || has(b.author) || has(b.publisher));
  const quoteHits = allQuotes().filter(x => has(x.text));
  const feelHits = books.filter(b => has(b.feeling) || has(b.summary));
  if(!bookHits.length && !quoteHits.length && !feelHits.length)
    return `<p class="hint" style="text-align:center;padding:40px 0">‘${esc(q)}’이(가) 들어간 기록이 없어요.</p>`;
  let html = "";
  if(quoteHits.length) html += `<div class="result-head">밑줄<span>${quoteHits.length}</span></div><div class="list">${quoteHits.map(x => quoteCard(x, q)).join("")}</div>`;
  if(bookHits.length) html += `<div class="result-head">책<span>${bookHits.length}</span></div><div class="list">${bookHits.map(rowCard).join("")}</div>`;
  if(feelHits.length) html += `<div class="result-head">느낌·줄거리<span>${feelHits.length}</span></div><div class="list">${feelHits.map(b =>
    `<button class="feel-hit" type="button" data-open="${esc(b.id)}"><strong>${esc(b.title)}</strong><p>${around(has(b.feeling) ? b.feeling : b.summary, q)}</p></button>`).join("")}</div>`;
  return html;
}

// ───────────────────────── 사진에서 글자 가져오기 ─────────────────────────
// 글자 인식(tesseract.js)은 폰 안에서 돌아간다. 사진은 서버로 보내지 않는다.
// 처음 한 번은 인식 프로그램과 한글 자료(약 1.5MB)를 받고, 그다음부터는 폰에 저장된 걸 쓴다.
const TESS_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js";
let ocrWorkerP = null, ocrLog = null;

function loadScript(src){
  return new Promise((res, rej) => {
    if(window.Tesseract) return res();
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("load"));
    document.head.appendChild(s);
  });
}
function getOcrWorker(){
  if(!ocrWorkerP) ocrWorkerP = (async () => {
    await loadScript(TESS_URL);
    return Tesseract.createWorker("kor", 1, {logger: m => ocrLog && ocrLog(m)});
  })().catch(e => { ocrWorkerP = null; throw e; });
  return ocrWorkerP;
}

// 인식 결과 다듬기: 줄바꿈을 이어 붙이고, '행 복 은'처럼 글자마다 띄운 곳을 붙인다
function cleanOcr(text){
  return String(text).split("\n").map(l => l.trim()).filter(Boolean).join(" ")
    .replace(/\s+/g, " ")
    .replace(/(^|\s)((?:[가-힣] ){2,}[가-힣])(?=\s|$)/g, (_, pre, run) => pre + run.replace(/ /g, ""))
    .replace(/ ([,.!?」』”’)\]])/g, "$1").replace(/([「『“‘(\[]) /g, "$1")
    .trim();
}

function setupOcr(){
  const file = $("#ocr-file"), area = $("#ocr-area"), img = $("#crop-img"), crop = $("#crop"), sel = $("#crop-sel"), status = $("#ocr-status");
  let photo = null, rect = null, start = null;

  $("#ocr-pick").onclick = () => file.click();
  $("#ocr-retake").onclick = () => file.click();
  // 인식 프로그램은 버튼을 누르는 순간부터 미리 받아 둔다
  $("#ocr-pick").addEventListener("click", () => getOcrWorker().catch(() => {}), {once: true});

  file.onchange = async () => {
    const f = file.files[0]; file.value = ""; if(!f) return;
    try { photo = await createImageBitmap(f, {imageOrientation: "from-image"}); }
    catch { return toast("사진을 열지 못했어요"); }
    if(img.src) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(f);
    rect = null; sel.hidden = true; status.textContent = "";
    area.hidden = false; $("#ocr-pick").hidden = true;
    area.scrollIntoView({block: "nearest"});
  };

  // 손가락으로 끌어서 네모 고르기 (화면 좌표 → 사진 좌표는 읽을 때 바꾼다)
  const pos = e => { const r = img.getBoundingClientRect(); return {x: Math.min(Math.max(e.clientX - r.left, 0), r.width), y: Math.min(Math.max(e.clientY - r.top, 0), r.height)}; };
  const draw = () => { Object.assign(sel.style, {left: rect.x + "px", top: rect.y + "px", width: rect.w + "px", height: rect.h + "px"}); sel.hidden = false; };
  crop.onpointerdown = e => { try { crop.setPointerCapture(e.pointerId); } catch {} start = pos(e); rect = {x: start.x, y: start.y, w: 0, h: 0}; draw(); };
  crop.onpointermove = e => {
    if(!start) return;
    const p = pos(e);
    rect = {x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y)};
    draw();
  };
  crop.onpointerup = crop.onpointercancel = () => { start = null; if(rect && (rect.w < 12 || rect.h < 12)){ rect = null; sel.hidden = true; } };

  $("#ocr-read").onclick = async () => {
    if(!photo) return;
    const btn = $("#ocr-read"); btn.disabled = true;
    // 고른 부분만 잘라서, 글자가 작으면 키우고 흑백으로 또렷하게 만든다
    const k = photo.width / img.clientWidth;
    const r = rect ? {x: rect.x * k, y: rect.y * k, w: rect.w * k, h: rect.h * k} : {x: 0, y: 0, w: photo.width, h: photo.height};
    const s = Math.min(2, Math.max(1, 1400 / r.w), 4000 / Math.max(r.w, r.h));
    const c = document.createElement("canvas");
    c.width = Math.round(r.w * s); c.height = Math.round(r.h * s);
    const ctx = c.getContext("2d");
    ctx.filter = "grayscale(1) contrast(1.4)";
    ctx.drawImage(photo, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);

    const firstTime = !ocrWorkerP;
    status.textContent = firstTime ? "글자 인식 준비 중이에요. 처음 한 번만 조금 걸려요…" : "글자를 읽는 중…";
    ocrLog = m => {
      const pct = Math.round((m.progress || 0) * 100);
      if(/recogniz/.test(m.status)) status.textContent = `글자를 읽는 중… ${pct}%`;
      else if(/load|download|initializ/.test(m.status)) status.textContent = `글자 인식 준비 중… ${pct}%`;
    };
    try {
      const worker = await getOcrWorker();
      const {data} = await worker.recognize(c, {}, {text: true, blocks: true});
      // 네모가 줄 가운데를 자르면 그 줄은 엉뚱한 글자가 나온다 → 확신이 낮은 줄(점수 60 미만)은 뺀다
      // (시험: 제대로 읽힌 줄은 87~94점, 잘린 줄은 0~32점)
      const lines = (data.blocks || []).flatMap(bl => bl.paragraphs.flatMap(p => p.lines));
      const good = lines.filter(l => l.confidence >= 60 && /[가-힣A-Za-z0-9]{2}/.test(l.text));
      const text = cleanOcr(lines.length ? good.map(l => l.text).join("\n") : data.text);
      if(!text){ status.textContent = "글자를 찾지 못했어요. 네모가 글자 줄을 자르지 않게 넉넉히 고르거나, 밝은 곳에서 다시 찍어 보세요."; return; }
      const ta = $("#qq-text");
      ta.value = ta.value.trim() ? ta.value.trim() + "\n" + text : text;
      area.hidden = true; $("#ocr-pick").hidden = false;
      toast(good.length < lines.length ? "잘려서 못 읽은 줄은 뺐어요. 틀린 곳을 고쳐 주세요" : "글자를 넣었어요. 틀린 곳을 고쳐 주세요");
      ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    } catch(e){
      console.error(e);
      status.textContent = "글자 인식을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.";
    } finally { btn.disabled = false; ocrLog = null; }
  };
}

// ───────────────────────── 등록 방법 고르기 ─────────────────────────
function waysBar(cur){
  const way = (key, label, sub, hash) => cur === key
    ? `<div class="way on">${label}<small>${sub}</small></div>`
    : `<button class="way" type="button" data-go-replace="${hash}">${label}<small>${sub}</small></button>`;
  return `<div class="ways">${way("scan", "바코드", "찍어서 등록", "#/scan")}${way("manual", "직접 입력", "바코드가 없을 때", "#/add")}</div>`;
}

// ───────────────────────── 바코드로 등록 ─────────────────────────
// 폰 카메라로 바코드(ISBN)를 읽고, 서버(/api/book)에서 책 정보를 받아 온다.
// 카메라로 못 읽는 폰(아이폰 사파리 등)은 바코드 아래 숫자를 직접 넣는다.
let scanStream = null, scanTimer = null, scanState = {status: "idle"}, draftIsbn = "";
const canDetect = "BarcodeDetector" in window;

function scanView(){
  return `<div class="topbar"><button class="back" type="button" data-back aria-label="뒤로">${ICON_BACK}</button><h1>책 등록</h1></div>
  ${waysBar("scan")}
  <div class="scanner">${canDetect
    ? `<video id="scan-video" playsinline muted></video><div class="scan-frame"></div><div class="scan-msg" id="scan-msg">카메라를 켜는 중…</div>`
    : `<div class="scan-off">이 폰에서는 카메라로 바코드를 읽을 수 없어요.<br>바코드 아래 숫자 13자리를 넣어 주세요.</div>`}</div>
  <form class="isbn-row" data-isbnform>
    <input id="isbn-input" class="field num" inputmode="numeric" placeholder="바코드 아래 숫자 (978…)" autocomplete="off" maxlength="17">
    <button class="btn" type="submit">찾기</button></form>
  <div id="scan-result">${scanResultView()}</div>`;
}

function scanResultView(){
  const s = scanState;
  if(s.status === "loading") return `<p class="hint" style="text-align:center;padding:24px 0">책 정보를 찾는 중이에요…</p>`;
  if(s.status === "dup") return `<div class="found"><p>『${esc(s.book.title)}』은(는) 이미 서재에 있어요.</p>
    <div class="two"><button class="btn ghost" type="button" data-scanagain>다른 책 찍기</button><button class="btn" type="button" data-open="${esc(s.book.id)}">책 보러 가기</button></div></div>`;
  if(s.status === "error") return `<div class="found"><p>${esc(s.message)}</p>
    <div class="two"><button class="btn ghost" type="button" data-scanagain>다시 찍기</button><button class="btn" type="button" data-manual-isbn>직접 입력하기</button></div></div>`;
  if(s.status !== "found") return "";
  const b = s.book;
  return `<div class="found">
    <div class="top">${cover({...b, rec: false}, "md")}<div class="t"><span class="ok">찾았어요</span><h3>${esc(b.title)}</h3>
      <span class="by">${esc([b.author, b.publisher].filter(Boolean).join(" · "))}</span><span class="sub num">ISBN ${esc(b.isbn)}</span></div></div>
    ${b.summary ? `<p class="sum clamp">${esc(b.summary)}</p>` : ""}
    ${b.authorBio ? `<span class="sub">작가 소개도 위키백과에서 가져왔어요</span>` : ""}
    <div><div class="sub" style="margin-bottom:8px">종류${b.genreAuto ? " (자동으로 골랐어요)" : " (골라 주세요)"}</div>
      <div class="genre-pick">${GENRES.map(g => `<button type="button" data-pickgenre="${g}" aria-pressed="${g === b.genre}">${g}</button>`).join("")}</div></div>

    <label class="check" style="display:flex"><input id="found-rec" type="checkbox"> 추천 목록에도 넣기</label>

// 작가 소개: 위키백과에서 찾는다(/api/author). 못 찾거나 4초 넘게 걸리면 빈칸으로 둔다.
async function fetchAuthorBio(author, title){
  if(!author) return null;
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch(`/api/author?name=${encodeURIComponent(author)}&title=${encodeURIComponent(title || "")}`, {signal: ctl.signal});
    clearTimeout(t);
    if(!r.ok) return null;
    const d = await r.json();
    return d.bio ? {bio: d.bio, url: /^https:\/\/ko\.(m\.)?wikipedia\.org\//.test(d.url || "") ? d.url : ""} : null;
  } catch { return null; }
}

const showScanResult = () => { const el = $("#scan-result"); if(el) el.innerHTML = scanResultView(); };

async function startScan(){
  if(!canDetect || scanStream) return;
  const msg = t => { const m = $("#scan-msg"); if(m) m.textContent = t; };
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment", width: {ideal: 1280}}, audio: false});
  } catch(e){
    msg("카메라를 쓸 수 없어요. 아래에 숫자를 넣어 주세요.");
    return;
  }
  if(parseRoute().name !== "scan"){ stopScan(); return; }
  const video = $("#scan-video");
  video.srcObject = scanStream; await video.play().catch(() => {});
  msg("책 뒷면 바코드를 네모 안에 맞춰 주세요");
  let detector;
  try { detector = new BarcodeDetector({formats: ["ean_13"]}); } catch { msg("이 폰은 바코드를 못 읽어요. 아래에 숫자를 넣어 주세요."); return; }
  const tick = async () => {
    if(!scanStream) return;
    try {
      const codes = await detector.detect(video);
      const code = codes.map(c => c.rawValue).find(v => /^97[89]\d{10}$/.test(v) && isbn13ok(v));
      if(code){ navigator.vibrate?.(60); stopScan(); return lookupIsbn(code); }
    } catch {}
    scanTimer = setTimeout(tick, 250);
  };
  tick();
}
function stopScan(){
  clearTimeout(scanTimer); scanTimer = null;
  if(scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}

// ISBN-13 마지막 숫자(검증 번호)가 맞는지 확인해서 잘못 읽은 바코드를 거른다
function isbn13ok(s){
  let sum = 0; for(let i = 0; i < 12; i++) sum += (+s[i]) * (i % 2 ? 3 : 1);
  return (10 - sum % 10) % 10 === +s[12];
}

async function lookupIsbn(isbn){
  const dup = books.find(b => b.isbn && b.isbn.replace(/\D/g, "") === isbn);
  if(dup){ scanState = {status: "dup", book: dup}; return showScanResult(); }
  scanState = {status: "loading"}; showScanResult();
  const msg = $("#scan-msg"); if(msg) msg.textContent = `${isbn} 읽었어요`;
  try {
    const r = await fetch(`/api/book?isbn=${isbn}`);
    const d = await r.json().catch(() => ({}));
    if(r.ok && d.title){
      const genre = GENRES.includes(d.genre) ? d.genre : "";
      const bio = await fetchAuthorBio(d.author, d.title);
      scanState = {status: "found", book: {isbn, title: d.title, author: d.author || "", publisher: d.publisher || "", cover: d.cover || "",
        summary: d.summary || "", genre: genre || "기타", genreAuto: !!genre, authorBio: bio?.bio || "", authorBioUrl: bio?.url || ""}};
    } else if(r.status === 404){
      scanState = {status: "error", isbn, message: "이 바코드로는 책 정보를 찾지 못했어요. 직접 입력해 주세요."};
    } else {
      scanState = {status: "error", isbn, message: "책 정보를 불러오지 못했어요. 잠시 뒤 다시 해 보거나 직접 입력해 주세요."};
    }
  } catch {
    scanState = {status: "error", isbn, message: "인터넷 연결을 확인해 주세요. 직접 입력할 수도 있어요."};
  }
  if(parseRoute().name === "scan") showScanResult();
}

// 책 카드 내용을 주소 '#' 뒤에 담아 /s 링크(s.html)로 보낸다.
// '#' 뒤는 서버로 전송되지 않아서, 공유한 내용이 북트랙 서버에 남지 않는다. 받는 사람은 앱 없이 브라우저로 본다.
let shareBook = null;
function openShare(b){
  shareBook = b;
  const m = $("#modal");
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="친구에게 공유">
    <h2>친구에게 이렇게 보여요</h2>
    <div id="share-preview"></div>
    <div class="share-opts">
      ${b.feeling ? `<label><input id="share-feel" type="checkbox" checked> 내 느낌도 함께 보내기</label>` : ""}
      ${b.quotes.length ? `<span class="opt-title">함께 보낼 밑줄</span>
        <label><input type="radio" name="share-q" value=""> 보내지 않기</label>
        ${b.quotes.map((q, i) => `<label><input type="radio" name="share-q" value="${esc(q.id)}" ${i === b.quotes.length - 1 ? "checked" : ""}><span class="qtext">${esc(q.text)}</span></label>`).join("")}` : ""}
    </div>
    <div class="two"><button class="btn ghost" type="button" id="share-copy">링크 복사</button><button class="btn" type="button" id="share-go">공유하기</button></div>
    <button class="linkbtn muted" type="button" id="share-close">닫기</button>
  </div>`;
  m.hidden = false;
  const update = () => { $("#share-preview").innerHTML = shareCardHtml(shareData()); };
  m.querySelectorAll("input").forEach(i => i.addEventListener("change", update));
  update();
  $("#share-close").onclick = () => m.hidden = true;
  $("#share-copy").onclick = async () => {
    const url = shareUrl(shareData());
    try { await navigator.clipboard.writeText(url); toast("링크를 복사했어요. 카톡에 붙여 넣으면 돼요"); }
    catch { prompt("이 링크를 복사해 주세요", url); }
  };
  $("#share-go").onclick = async () => {
    const d = shareData(), url = shareUrl(d);
    const text = `『${d.t}』${d.a ? " " + d.a : ""}${d.q ? `\n\n“${d.q}”` : ""}\n\nBook Track에서 보낸 책 카드예요.`;
    if(navigator.share){
      try { await navigator.share({title: `『${d.t}』`, text, url}); m.hidden = true; }
      catch(e){ if(e.name !== "AbortError") toast("공유하지 못했어요. 링크 복사를 써 주세요"); }
    } else $("#share-copy").click();
  };
}

// 공유할 내용 (짧은 이름으로 담아 주소를 줄인다). s: 0 읽는 중, 1 다 읽음, 2 읽고 싶은
function shareData(){
  const b = shareBook;
  const qid = document.querySelector('input[name="share-q"]:checked')?.value;
  const q = b.quotes.find(x => x.id === qid);
  const feel = $("#share-feel")?.checked ? b.feeling : "";
  const cut = (s, n) => s.length > n ? s.slice(0, n) + "…" : s;
  return {t: b.title, a: b.author, p: b.publisher, g: b.genre, c: b.cover, r: b.rec ? 1 : 0, s: b.status === "done" ? 1 : b.status === "want" ? 2 : 0,
    f: cut(feel || "", 400), q: q ? cut(q.text, 300) : "", qp: q?.page || ""};
}

function shareUrl(d){
  const clean = Object.fromEntries(Object.entries(d).filter(([, v]) => v !== "" && v !== 0));
  const bytes = new TextEncoder().encode(JSON.stringify(clean));
  let bin = ""; bytes.forEach(x => bin += String.fromCharCode(x));
  const b64 = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return `${location.origin}/s#${b64}`;
}

// 미리보기 카드 (받는 쪽 s.html과 같은 내용)
function shareCardHtml(d){
  return `<div class="share-card">
    ${d.r ? `<span class="rec">이 책을 추천해요</span>` : ""}
    <div class="top">${cover({title: d.t, author: d.a, cover: d.c}, "md")}<div class="t"><span class="hint" style="font-size:12.5px">${esc(d.g || "")}</span>
      <h3>${esc(d.t)}</h3><span class="by">${esc([d.a, d.p].filter(Boolean).join(" · "))}</span>
      <span class="by">${["지금 읽고 있어요", "다 읽었어요", "읽고 싶은 책이에요"][d.s || 0]}</span></div></div>
    ${d.f ? `<p class="feel">${esc(d.f)}</p>` : ""}
    ${d.q ? `<p class="q"><span class="ul">${esc(d.q)}</span>${d.qp ? ` <span class="hint num" style="font-size:12px">p.${esc(d.qp)}</span>` : ""}</p>` : ""}
  </div>`;
}

// ───────────────────────── 백업 ─────────────────────────
function exportBackup(){
  const data = {app: "BOOKTRACK", version: 1, exportedAt: nowIso(), books};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `booktrack-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("백업 파일을 저장했어요");
}

// 옛 기록이나 다른 버전 파일도 안전하게 읽도록 모양을 맞춘다
function normalizeBook(x){
  if(!x || typeof x !== "object" || !x.id || !x.title) return null;
  return {
    id: String(x.id), title: String(x.title), author: String(x.author || ""), publisher: String(x.publisher || ""),
    isbn: String(x.isbn || ""), cover: /^https:\/\//.test(x.cover || "") ? String(x.cover) : "", genre: GENRES.includes(x.genre) ? x.genre : "기타",
    status: ["want", "reading", "done"].includes(x.status) ? x.status : "reading", rec: !!x.rec,
    startedAt: x.startedAt || "", finishedAt: x.finishedAt || "",
    summary: String(x.summary || ""), authorBio: String(x.authorBio || ""),
    authorBioUrl: /^https:\/\/ko\.(m\.)?wikipedia\.org\//.test(x.authorBioUrl || "") ? String(x.authorBioUrl) : "", feeling: String(x.feeling || ""),
    quotes: Array.isArray(x.quotes) ? x.quotes.filter(q => q && q.text).map(q => ({id: String(q.id || newId()), text: String(q.text), page: q.page ? String(q.page) : "", createdAt: q.createdAt || ""})) : [],
    createdAt: x.createdAt || nowIso(), updatedAt: x.updatedAt || "",
  };
}

async function importBackup(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast("백업 파일을 읽지 못했어요"); }
  if(!data || data.app !== "BOOKTRACK" || !Array.isArray(data.books)) return toast("Book Track 백업 파일이 아니에요");
  let added = 0, updated = 0;
  for(const raw of data.books){
    const b = normalizeBook(raw); if(!b) continue;
    const cur = findBook(b.id);
    if(!cur){ books.push(b); added++; await dbPut(b); }
    else if((b.updatedAt || "") > (cur.updatedAt || "")){ Object.assign(cur, b); updated++; await dbPut(cur); }
  }
  render();
  toast(`새 책 ${added}권, 고친 책 ${updated}권을 불러왔어요`);
}

// ───────────────────────── 버튼 처리 ─────────────────────────
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t || t.closest("#modal")) return;
  const r = parseRoute();
  const cur = r.name === "book" ? findBook(r.arg) : null;

  if(t.id === "nav-home") return go("#/home");
  if(t.id === "nav-shelf") return go("#/shelf/" + shelfFilter);
  if(t.id === "nav-quotes") return go("#/quotes");
  if(t.id === "nav-me") return go("#/me");
  if(t.id === "nav-add") return go("#/scan");
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.goReplace) return goReplace(t.dataset.goReplace);
  if(t.dataset.open) return go("#/book/" + encodeURIComponent(t.dataset.open));
  if(t.hasAttribute("data-back")) return history.length > 1 ? history.back() : goReplace("#/home");
  if(t.dataset.quickquote){ const b = findBook(t.dataset.quickquote); if(b) openQuoteSheet(b); return; }

  if(t.dataset.fstatus){
    t.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === t));
    return;
  }
  if(t.hasAttribute("data-shuffle")){ quoteShift++; return render(); }
  if(t.dataset.pickgenre && scanState.book){
    scanState.book.genre = t.dataset.pickgenre;
    t.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === t));
    return;
  }
  if(t.hasAttribute("data-scanagain")){ scanState = {status: "idle"}; showScanResult(); return startScan(); }
  if(t.hasAttribute("data-manual-isbn")){ draftIsbn = scanState.isbn || ""; return goReplace("#/add"); }
  if(t.hasAttribute("data-addfound") && scanState.status === "found"){
    const s = scanState.book;
    const st = pickedStatus($("#scan-result"));
    const b = normalizeBook({id: newId(), title: s.title, author: s.author, publisher: s.publisher, isbn: s.isbn, cover: s.cover,
      summary: s.summary, authorBio: s.authorBio, authorBioUrl: s.authorBioUrl, genre: s.genre, status: st, rec: $("#found-rec").checked,
      ...newDates(st), quotes: [], createdAt: nowIso()});
    books.push(b); saveBook(b);
    scanState = {status: "idle"};
    toast(addedToast(st)); return goReplace("#/book/" + encodeURIComponent(b.id));
  }
  if(t.hasAttribute("data-export")) return exportBackup();
  if(t.hasAttribute("data-import")) return $("#import-file").click();
  if(!cur) return;

  if(t.dataset.status){
    if(cur.status === t.dataset.status) return;
    cur.status = t.dataset.status;
    if(cur.status === "done"){ cur.finishedAt = nowIso(); cur.startedAt ||= nowIso(); toast("다 읽었어요. 서재에 꽂았어요"); }
    else if(cur.status === "reading"){ cur.finishedAt = ""; cur.startedAt ||= nowIso(); toast("오늘부터 읽는 중이에요"); }
    else { cur.startedAt = ""; cur.finishedAt = ""; toast("읽고 싶은 책으로 옮겼어요"); }
    saveBook(cur); return render();
  }
  if(t.hasAttribute("data-rec")){
    cur.rec = !cur.rec; toast(cur.rec ? "추천 목록에 넣었어요" : "추천 목록에서 뺐어요");
    saveBook(cur); return render();
  }
  if(t.hasAttribute("data-more")){ summaryOpen = !summaryOpen; return render(); }
  if(t.hasAttribute("data-findbio")){
    t.disabled = true; t.textContent = "찾는 중…";
    return fetchAuthorBio(cur.author, cur.title).then(async bio => {
      if(bio){ cur.authorBio = bio.bio; cur.authorBioUrl = bio.url; await saveBook(cur); toast("작가 소개를 가져왔어요"); }
      else toast("위키백과에서 찾지 못했어요. 수정에서 직접 쓸 수 있어요");
      if(findBook(cur.id) && parseRoute().arg === cur.id) render();
    });
  }
  if(t.hasAttribute("data-share")) return openShare(cur);
  if(t.dataset.delquote){
    const id = t.dataset.delquote;
    return ask("이 밑줄을 지울까요?", "지우기", () => {
      cur.quotes = cur.quotes.filter(q => q.id !== id); saveBook(cur); render(); toast("밑줄을 지웠어요");
    }, true);
  }
  if(t.hasAttribute("data-delbook")){
    return ask(`『${esc(cur.title)}』을(를) 지울까요?<small>느낌과 밑줄도 함께 지워지고, 되돌릴 수 없어요.</small>`, "지우기", async () => {
      books = books.filter(b => b !== cur);
      try { await dbDelete(cur.id); } catch(e){ console.error(e); }
      toast("책을 지웠어요"); goReplace("#/shelf/" + shelfFilter);
    }, true);
  }
});
$("#modal").addEventListener("click", e => { if(e.target.id === "modal") e.target.hidden = true; });
document.addEventListener("keydown", e => { if(e.key === "Escape") $("#modal").hidden = true; });

// 느낌은 쓰는 동안 자동 저장
document.addEventListener("input", e => {
  // 찾기: 글자를 칠 때마다 결과만 다시 그림 (입력 칸은 그대로 둠)
  if(e.target.id === "search-input"){ searchQuery = e.target.value; $("#results").innerHTML = searchResults(); return; }
  if(!e.target.hasAttribute("data-feel")) return;
  const r = parseRoute(), cur = findBook(r.arg); if(!cur) return;
  cur.feeling = e.target.value;
  $("#feel-state").textContent = "쓰는 중…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => { await saveBook(cur); const s = $("#feel-state"); if(s) s.textContent = "저장됨"; }, 600);
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, r = parseRoute();

  if(f.hasAttribute("data-isbnform")){
    let v = $("#isbn-input").value.replace(/[^0-9Xx]/g, "").toUpperCase();
    if(!/^(\d{13}|\d{9}[\dX])$/.test(v) || (v.length === 13 && !isbn13ok(v))){ toast("숫자 13자리를 다시 확인해 주세요"); return; }
    stopScan(); $("#isbn-input").blur();
    return lookupIsbn(v);
  }

  // 밑줄 긋기 창
  if(f.hasAttribute("data-quickform")){
    const b = findBook($("#modal").dataset.book); if(!b) return;
    const text = $("#qq-text").value.trim();
    if(!text){ $("#qq-text").focus(); toast("문장을 적어 주세요"); return; }
    b.quotes.push({id: newId(), text, page: $("#qq-page").value.trim(), createdAt: nowIso()});
    await saveBook(b);
    $("#modal").hidden = true; render(); toast("밑줄을 그었어요");
    return;
  }

  if(f.hasAttribute("data-bookform")){
    const title = $("#f-title").value.trim();
    if(!title){ $("#f-title").focus(); return; }
    const fields = {
      title, author: $("#f-author").value.trim(), publisher: $("#f-publisher").value.trim(),
      genre: $("#f-genre").value, summary: $("#f-summary").value.trim(), authorBio: $("#f-bio").value.trim(),
    };
    if(r.name === "edit"){
      const cur = findBook(r.arg); if(!cur) return;
      // 위키백과 소개를 손으로 고쳤으면 더 이상 '위키백과에서 가져옴'이 아니다
      if(fields.authorBio !== cur.authorBio) fields.authorBioUrl = "";
      Object.assign(cur, fields); await saveBook(cur);
      toast("저장했어요"); history.back();
    } else {
      const st = pickedStatus(f);
      const b = normalizeBook({...fields, id: newId(), isbn: draftIsbn, status: st, rec: $("#f-rec").checked,
        ...newDates(st), quotes: [], createdAt: nowIso()});
      draftIsbn = "";
      books.push(b); await saveBook(b);
      toast(addedToast(st)); goReplace("#/book/" + encodeURIComponent(b.id));
    }
  }
});

$("#import-file").addEventListener("change", e => {
  const file = e.target.files[0]; e.target.value = "";
  if(file) importBackup(file);
});

// ───────────────────────── 시작 ─────────────────────────
(async () => {
  try { books = (await dbAll()).map(normalizeBook).filter(Boolean); }
  catch(e){ console.error(e); toast("기록을 불러오지 못했어요"); }
  // 브라우저가 저장 공간을 마음대로 비우지 않게 요청
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render(true);
})();

if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
