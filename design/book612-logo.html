<h2 class="sr-only">Book612 로고: 아이콘과 글자를 한 그림으로 묶어 양쪽 폭 맞춤</h2>
<link id="juaCss" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
.card{background:#f5eedc;border-radius:12px;padding:30px 16px 26px;display:flex;justify-content:center;align-items:center}
.lk{display:block;height:auto;max-width:100%}
.gl{display:none}.show .gl{display:inline}
.lab{font-size:13px;color:var(--text-secondary);text-align:center;margin-top:8px}
.tw{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}
.sp{transform-box:fill-box;transform-origin:center;animation:sp 3.2s ease-in-out infinite}
@keyframes sp{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.35) rotate(45deg);opacity:.35}}
.head{transform-box:fill-box;transform-origin:50% 100%;animation:bloom 8s ease-in-out infinite}
@keyframes bloom{0%{transform:scale(.3) rotate(0);opacity:1}28%{transform:scale(1) rotate(0);opacity:1}62%{transform:scale(1) rotate(0);opacity:1}78%{transform:scale(.88) rotate(38deg);opacity:1}90%{transform:scale(.6) rotate(55deg);opacity:0}91%{transform:scale(.3) rotate(0);opacity:0}100%{transform:scale(.3) rotate(0);opacity:1}}
.pet{animation:wilt 8s ease-in-out infinite}
@keyframes wilt{0%,62%{fill:#e4574f}86%{fill:#a35a52}91%,100%{fill:#e4574f}}
.pf{transform-box:fill-box;transform-origin:center;opacity:0}
.pf1{animation:fall1 8s ease-in infinite}.pf2{animation:fall2 8s ease-in infinite}
@keyframes fall1{0%,70%{opacity:0;transform:translate(0,0) rotate(0)}74%{opacity:1}94%{opacity:0;transform:translate(-5px,13px) rotate(-140deg)}100%{opacity:0}}
@keyframes fall2{0%,75%{opacity:0;transform:translate(0,0) rotate(0)}79%{opacity:1}98%{opacity:0;transform:translate(6px,11px) rotate(160deg)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.tw,.sp,.head,.pet,.pf1,.pf2{animation:none!important}}
</style>
<div style="padding:0.75rem 0 0.25rem" id="wrap">
 <div class="card"><svg class="lk" data-w="160"></svg></div><div class="lab">첫 화면 크기</div>
 <div style="display:flex;gap:12px;margin-top:12px">
  <div style="flex:1"><div class="card"><svg class="lk" data-w="92"></svg></div><div class="lab">공유 화면 크기</div></div>
  <div style="flex:1"><div class="card"><svg class="lk" data-w="56"></svg></div><div class="lab">더 작게</div></div>
 </div>
</div>
<div style="text-align:center;margin:8px 0 4px"><button id="gbtn" type="button">정렬선 보기</button></div>
<script>
// 아이콘과 글자를 '한 장의 그림'(viewBox 하나)에 같이 그린다 → 화면이 좁아 줄어들어도 둘이 같이 줄어서 정렬이 안 깨진다
const DOTS = [[18,20,1.6,1],[90,44,1.2],[13,52,1],[28,36,.9],[9,30,.8],[36,12,1.1],[62,9,.9],[72,24,1.3,1],[95,62,.9],
  [87,88,1.1],[13,82,1],[22,95,.8],[79,97,.9],[96,26,.8],[27,60,.9],[80,52,.8,1],[46,22,.7],[8,66,.7],[94,78,.7],[30,80,.6],[70,40,.6]];
const SPARK = [[24,27,3.2],[86,70,3],[40,6,2.4]];
const ICON = (() => {
  const dots = DOTS.map(([x,y,r,g],i) => `<circle class="tw" style="animation-delay:${(i*0.37)%2.6}s" cx="${x}" cy="${y}" r="${r}" fill="${g?'#f6c453':'#fff'}"/>`).join("");
  const sparks = SPARK.map(([x,y,s],i) => `<path class="sp" style="animation-delay:${i*0.9}s" d="M${x} ${y-s}Q${x} ${y} ${x+s} ${y}Q${x} ${y} ${x} ${y+s}Q${x} ${y} ${x-s} ${y}Q${x} ${y} ${x} ${y-s}z" fill="#fff"/>`).join("");
  return `<rect width="104" height="104" rx="24" fill="#2b3a72"/>${dots}${sparks}
  <path class="sp" style="animation-delay:.4s" d="M84 10l2.2 5 5 .6-3.8 3.3 1.1 5-4.5-2.6-4.5 2.6 1.1-5-3.8-3.3 5-.6z" fill="#f6c453"/>
  <circle cx="52" cy="70" r="22" fill="#f5eedc"/>
  <circle cx="42" cy="76" r="4.4" fill="#b9a982"/><circle cx="41.2" cy="75.2" r="2.8" fill="#9c8b62"/>
  <circle cx="60" cy="83" r="3.4" fill="#b9a982"/><circle cx="59.4" cy="82.4" r="2.1" fill="#9c8b62"/>
  <circle cx="64" cy="67" r="2.2" fill="#b9a982"/><circle cx="63.6" cy="66.6" r="1.3" fill="#9c8b62"/>
  <circle cx="50" cy="87" r="1.8" fill="#b9a982"/>
  <g transform="translate(51 67) scale(1.6)">
   <path d="M0 0c-.6-5 .4-9 0-12" stroke="#3d8a5a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
   <path d="M0-5c-4-.4-6-3-5.8-5.6 3 .2 5.4 2 5.8 5.6z" fill="#3d8a5a"/>
   <g class="head">
    <path class="pet" d="M0-12c-5-1-6.4-5.6-4.4-9.4 1.6-2 3.6-1.8 4.4.2.8-2 2.8-2.2 4.4-.2 2 3.8.6 8.4-4.4 9.4z" fill="#e4574f"/>
    <path d="M-2.4-19.4c1.2 1.8 3.6 1.8 4.8 0" stroke="#c43c35" stroke-width="1.1" fill="none"/>
   </g>
   <ellipse class="pf pf1" cx="-2.6" cy="-14" rx="1.7" ry="1" fill="#c9524a"/>
   <ellipse class="pf pf2" cx="2.8" cy="-15" rx="1.6" ry="1" fill="#c9524a"/>
  </g>`;
})();
// "Book612" 실제 획의 왼쪽 끝(B)~오른쪽 끝(2)을 아이콘 폭(104)에 맞춤. 글꼴이 늦게 와도 들어올 때마다 다시 그림
function draw(){
  const ctx = document.createElement("canvas").getContext("2d"), k = .56, base = 100;
  const m = (t, s) => { ctx.font = s + "px Jua"; return ctx.measureText(t); };
  const B = m("B", base), O = m("ook", base * k), N = m("612", base);
  const f = 104 / (B.actualBoundingBoxLeft + B.width + O.width + N.actualBoundingBoxRight), s = base * f;
  const lB = B.actualBoundingBoxLeft * f, xO = lB + B.width * f, xN = xO + O.width * f, a = B.actualBoundingBoxAscent * f;
  const gap = 13, y = 104 + gap + a, H = y + 1;
  const words = `<text x="${lB}" y="${y}" font-family="Jua" font-size="${s}" fill="#e0a823">B</text>
    <text x="${xO}" y="${y}" font-family="Jua" font-size="${s * k}" fill="#1f2a55">ook</text>
    <text x="${xN}" y="${y}" font-family="Jua" font-size="${s}" fill="#e0a823">612</text>`;
  const guides = `<g class="gl" stroke="#e4574f" stroke-width=".5" stroke-dasharray="2 2"><path d="M0 -6V${H + 6}M104 -6V${H + 6}"/></g>`;
  document.querySelectorAll(".lk").forEach(el => {
    el.setAttribute("viewBox", `0 0 104 ${H.toFixed(2)}`);
    el.setAttribute("overflow", "visible");
    el.style.width = el.dataset.w + "px";
    el.innerHTML = ICON + words + guides;
  });
}
draw();
let last = 0;
const redraw = () => { const ok = document.fonts && document.fonts.check("40px Jua"); if (ok && last !== 1) { last = 1; draw(); } };
const again = () => document.fonts.load("100px Jua", "Book612").then(redraw).catch(() => {});
document.getElementById("juaCss").addEventListener("load", again); again();
if (document.fonts) { document.fonts.addEventListener("loadingdone", redraw); document.fonts.ready.then(redraw); }
setTimeout(again, 800); setTimeout(again, 2500);
document.getElementById("gbtn").onclick = e => {
  const on = document.getElementById("wrap").classList.toggle("show");
  e.target.textContent = on ? "정렬선 숨기기" : "정렬선 보기";
};
</script>
